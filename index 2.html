/* ---------------- HELPERS ---------------- */
const round = (n, d=0) => { const f = Math.pow(10,d); return Math.round(n*f)/f; };
const calcIMC = (poids, tailleCm) => { const t = tailleCm/100; return poids/(t*t); };
const calcPPT = (tailleCm, sexe) => (sexe==="H"?50:45.5) + 0.91*(tailleCm-152.4);
function calcPoidsNutritionnel(poidsReel, tailleCm, sexe){
  const imc = calcIMC(poidsReel, tailleCm);
  const ppt = calcPPT(tailleCm, sexe);
  if (imc < 30) return { imc, ppt, poidsNutritionnel: poidsReel, ajuste:false };
  const poidsAjuste = ppt + 0.25*(poidsReel - ppt);
  return { imc, ppt, poidsNutritionnel: poidsAjuste, ajuste:true };
}
function buildProgression(kcalTargetPerKg, sriRisk){
  const rows = [];
  const PLATEAU_VALUES = [15, 20]; // paliers maintenus 48h (uniquement si SRI)
  function pushStep(day, kcal){
    rows.push({day, kcal});
    if (sriRisk && PLATEAU_VALUES.includes(kcal)) rows.push({day: day+1, kcal});
    return (sriRisk && PLATEAU_VALUES.includes(kcal)) ? day+2 : day+1;
  }
  if (sriRisk){
    let day=1;
    while(day<=3){ rows.push({day, kcal:Math.min(10,kcalTargetPerKg)}); day++; }
    let current = Math.min(10,kcalTargetPerKg);
    while(current<kcalTargetPerKg && day<=16){ current=Math.min(current+5,kcalTargetPerKg); day = pushStep(day, current); }
  } else {
    let day=1; let current=Math.min(5,kcalTargetPerKg);
    rows.push({day,kcal:current}); day++;
    while(current<kcalTargetPerKg && day<=16){ current=Math.min(current+5,kcalTargetPerKg); day = pushStep(day, current); }
  }
  return rows;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- SHARED: cibles nutritionnelles ---------------- */
function getTargets(){
  const tailleN = parseFloat(state.taille)||0;
  const poidsN = parseFloat(state.poids)||0;
  const phase = PHASES[state.phaseKey];
  const result = (tailleN && poidsN) ? calcPoidsNutritionnel(poidsN, tailleN, state.sexe) : null;
  let kcalPerKg = phase.kcalMin + (phase.kcalMax-phase.kcalMin)*state.kcalRatio;
  const protPerKg = phase.protMin + (phase.protMax-phase.protMin)*state.kcalRatio;
  const eercRehabActive = state.phaseKey === "eerc" && state.eercRehab;
  if (eercRehabActive) kcalPerKg = 30;
  const kcalTarget = result ? kcalPerKg*result.poidsNutritionnel : 0;
  const protTarget = result ? protPerKg*result.poidsNutritionnel : 0;
  return { tailleN, poidsN, phase, result, kcalPerKg, protPerKg, kcalTarget, protTarget, eercRehabActive };
}

    ${step(2,"Soluté à base de fibres mixtes (gomme de guar, amidon, cellulose, pectine) en 1<sup>re</sup> intention : Nutrison Prot NRJ Multifibres.")}
    ${step(3,"Laxatifs (systématiques d'emblée si morphiniques) : <strong>macrogol</strong> 20 g matin, <strong>trimébutine</strong> (Debridat) 100 mg x3–6/j, <strong>bisacodyl</strong> (Dulcolax) 10 mg matin, pruneaux matin/midi ou jus de pruneaux 200 mL matin/midi ; <strong>naloxégol</strong> (Moventig) 25 mg matin ou <strong>méthylnaltrexone</strong> (Relistor) SC 12 mg/2j si morphiniques dans les 24 dernières heures.")}
    ${step(4,"Si insuffisant : <strong>Gastrografine</strong> 100 mL une fois, PO ou SNG (ASP inutile).")}
    ${step(5,"Si insuffisant : <strong>néostigmine</strong> 2–3 mg IVL sur 1 h, possible en IVSE sur plusieurs heures voire 24 h chez les patients fragiles (seulement si scanner objectivant l'absence d'obstacle mécanique).")}
    <div class="info-box">${ICONS.info}<span>Pour les laxatifs osmotiques (macrogol, lactulose), il est préférable de les administrer <strong>2 par 2</strong> afin de réaliser une charge osmotique.</span></div>
  </div>
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.alert}</div>
      <div><h2>Fécalome</h2><p class="subtext">Prise en charge</p></div></div>
    ${step(1,"<strong>Lavement Normacol</strong>, <strong>suppositoires Eductyl</strong>.")}
    ${step(2,"Si insuffisant : lavement « paraffine-eau tiède » quotidien = 3 L de <strong>NaCl 0,9 %</strong> tiède contenant 3 <strong>Lansoyl</strong>, à connecter sur une sonde rectale.")}
  </div>`;
}

/* ---------------- RENDER: SRI ---------------- */
function renderSri(){
  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.alert}</div>
      <div><h2>Syndrome de renutrition inappropriée</h2><p class="subtext">Tout patient hospitalisé en réanimation depuis &gt; 48 h est à risque</p></div></div>
    <div class="grid grid-2">
      <div class="stat"><div class="field-label" style="margin-bottom:8px;">Conséquences possibles</div>
        <div style="font-size:13px; line-height:1.6;">Hypophosphorémie, hypomagnésémie, hypokaliémie, hyperglycémie, béri-béri (carence en thiamine), rétention hydrosodée ou défaillances d'organe (cardiaque, neurologique, respiratoire, rénale, hépatique, musculaire, hématologique). L'hypophosphatémie est la conséquence biologique la plus grave.</div></div>
      <div class="stat"><div class="field-label" style="margin-bottom:8px;">Prévention</div>
        <div style="font-size:13px; line-height:1.6;">Début à 10 kcal/kg/j pendant 1 à 3 jours, puis +5 kcal/24–48 h jusqu'à la cible (7 à 10 jours). Vitamine B1 300 mg/j pendant 5 jours. Prudence avec les apports caloriques non nutritionnels.</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.clip}</div>
      <div><h2>Facteurs de risque</h2><p class="subtext">Un seul critère majeur, ou au moins deux critères mineurs, définit un patient à risque</p></div></div>
    <div class="grid grid-2">
      <div class="stat" style="background:var(--redDim); border:1px solid rgba(239,93,111,.35);">
        <div class="field-label" style="color:var(--red); margin-bottom:10px;">Critères majeurs — un seul suffit</div>
        ${SRI_CRITERES_MAJEURS.map(c=>`<div style="font-size:13px; line-height:1.6; margin-bottom:6px; color:var(--text);">— ${c}</div>`).join('')}
      </div>
      <div class="stat" style="background:var(--amberDim); border:1px solid rgba(242,169,59,.35);">
        <div class="field-label" style="color:var(--amber); margin-bottom:10px;">Critères mineurs — au moins deux</div>
        ${SRI_CRITERES_MINEURS.map(c=>`<div style="font-size:13px; line-height:1.6; margin-bottom:6px; color:var(--text);">— ${c}</div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.syringe}</div>
      <div><h2>Correction de l'hypophosphatémie</h2><p class="subtext">Précautions à prendre pendant la renutrition</p></div></div>
    <div class="warn-box" style="background:var(--amberDim); color:var(--amber); margin-top:0;">${ICONS.alert}<span><strong>Pas de majoration de la nutrition en cas d'hypophosphatémie.</strong></span></div>
    <div class="row-item" style="margin-top:12px;">
      <div><div class="t">Phosphatémie &lt; 0,65 mM</div><div class="s">Avant renutrition ou en cours de renutrition</div></div>
      <div class="badgeval" style="color:var(--amber); background:var(--amberDim); text-align:right;">Réduire à 500 kcal/j x2j, puis +5 kcal/kg/j jusqu'à la cible</div>
    </div>
    <div class="row-item">
      <div><div class="t">Phosphatémie &lt; 0,4 mM</div><div class="s">Hypophosphatémie sévère</div></div>
      <div class="badgeval" style="color:var(--red); background:var(--redDim); text-align:right;">Suspension de la nutrition</div>
    </div>
    <div class="info-box" style="border:1px solid rgba(239,93,111,.35);"><span><strong>Phocytan</strong> 0,66 mM/mL (1800 mOsm/L) : 10 mL = 300 mg de sodium (= SSH 3 %) + 1 g de glucose. Attention aux recharges : <strong style="color:var(--red);">ne pas dépasser 20 mmol/h, soit 30 mL/h</strong>.</span></div>
    <div class="info-box"><span><strong>Surveillance :</strong> iono plasmatique minimum x2/j si SRI avéré. ECG si trouble ionique sévère.</span></div>
  </div>`;
}

/* ---------------- RENDER: DEBITS ---------------- */
function renderDebit(){
  const products = DEBIT_PRODUCTS[state.debitVoie];
  const product = products.find(p => p.id === state.debitProduitId) || products[0];
  const { result, kcalTarget } = getTargets();
  const poidsNutri = result ? result.poidsNutritionnel : null;

  const sourceTabs = `
    <div class="seg" style="margin-bottom:18px;">
      <button data-act="debitSource" data-val="cible" class="${state.debitSource==='cible'?'active':''}">À partir de la cible calorique</button>
      <button data-act="debitSource" data-val="debit" class="${state.debitSource==='debit'?'active':''}">À partir d'un débit</button>
    </div>`;

  const voieSelector = `
    <div class="seg" style="margin-bottom:16px;">
      <button data-act="debitVoie" data-val="enterale" class="${state.debitVoie==='enterale'?'active':''}">Entérale</button>
      <button data-act="debitVoie" data-val="parenterale" class="${state.debitVoie==='parenterale'?'active':''}">Parentérale</button>
    </div>`;

  const produitSelector = `
    <label class="field" style="margin-bottom:16px; display:block;">
      <span class="field-label">Soluté</span>
      <select id="f-debit-produit" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--borderLight); background:var(--elevated); color:var(--text); font-family:var(--fontBody); font-size:14px;">
        ${products.map(p => `<option value="${p.id}" ${p.id===product.id?'selected':''}>${p.nom} — ${p.kcalPerMl} kcal/mL, ${p.protPer100ml} g prot/100mL</option>`).join('')}
      </select>
      <div class="subtext" style="margin-top:6px;">${product.note} · Osmolarité ${product.osmolarite} mOsm/L</div>
    </label>`;

  let resultsHtml = "";

  if (state.debitSource === "cible"){
    const kcalManuel = state.debitKcalManuel !== "" ? parseFloat(state.debitKcalManuel) : kcalTarget;

    resultsHtml = `
      <label class="field" style="margin-bottom:14px; display:block;">
        <span class="field-label">Cible calorique (kcal/j)</span>
        <div class="input-wrap"><input type="number" id="f-debit-kcal" value="${state.debitKcalManuel !== "" ? state.debitKcalManuel : (kcalTarget ? round(kcalTarget) : "")}" placeholder="${kcalTarget ? round(kcalTarget) : 'Renseigner la cible dans Calculateur'}"><span class="unit">kcal/j</span></div>
        <div class="subtext" style="margin-top:6px;">${kcalTarget ? `Pré-rempli depuis l'onglet Calculateur (${round(kcalTarget)} kcal/j)` : "Renseigner taille/poids dans l'onglet Calculateur pour pré-remplir"}</div>
      </label>
      <label class="field" style="margin-bottom:16px; display:block;">
        <span class="field-label">Mode d'administration</span>
        <div class="seg">
          <button data-act="debitDureeType" data-val="continu" class="${state.debitDureeType==='continu'?'active':''}">Continu (sur 24 h)</button>
          <button data-act="debitDureeType" data-val="discontinu" class="${state.debitDureeType==='discontinu'?'active':''}">Discontinu (3 x 3 h)</button>
        </div>
      </label>`;

    if (kcalManuel && !isNaN(kcalManuel) && kcalManuel > 0){
      const volumeTotal = kcalManuel / product.kcalPerMl;
      const proteinesJ = volumeTotal * (product.protPer100ml/100);
      const proteinesKg = poidsNutri ? proteinesJ/poidsNutri : null;

      if (state.debitDureeType === "continu"){
        const debitH = volumeTotal / 24;
        resultsHtml += `
        <div class="grid grid-2" style="margin-top:8px;">
          <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
            <div class="lbl" style="color:var(--teal);">Volume total</div>
            <div class="val" style="color:var(--teal);">${round(volumeTotal)} <span style="font-size:13px;">mL/j</span></div>
          </div>
          <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
            <div class="lbl" style="color:var(--teal);">Débit continu (24 h)</div>
            <div class="val" style="color:var(--teal);">${round(debitH,1)} <span style="font-size:13px;">mL/h</span></div>
          </div>
          <div class="stat">
            <div class="lbl">Protéines apportées</div>
            <div class="val">${round(proteinesJ,1)} <span style="font-size:13px;">g/j</span></div>
          </div>
          <div class="stat">
            <div class="lbl">Protéines / kg</div>
            <div class="val">${proteinesKg ? round(proteinesKg,2) : '—'} <span style="font-size:13px;">g/kg/j</span></div>
          </div>
        </div>`;
      } else {
        const volumeAdmin = volumeTotal / 3;
        const debitAdmin = volumeAdmin / 3;
        resultsHtml += `
        <div class="subtext" style="margin-bottom:10px;">3 administrations par jour, chacune sur 3 h</div>
        <div class="grid grid-2" style="margin-top:8px;">
          <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
            <div class="lbl" style="color:var(--teal);">Volume par administration</div>
            <div class="val" style="color:var(--teal);">${round(volumeAdmin)} <span style="font-size:13px;">mL / 3h</span></div>
          </div>
          <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
            <div class="lbl" style="color:var(--teal);">Débit horaire</div>
            <div class="val" style="color:var(--teal);">${round(debitAdmin,1)} <span style="font-size:13px;">mL/h</span></div>
          </div>
          <div class="stat">
            <div class="lbl">Volume total</div>
            <div class="val">${round(volumeTotal)} <span style="font-size:13px;">mL/j</span></div>
          </div>
          <div class="stat">
            <div class="lbl">Protéines apportées</div>
            <div class="val">${round(proteinesJ,1)} <span style="font-size:13px;">g/j</span></div>
          </div>
        </div>`;
      }
    } else {
      resultsHtml += `<div class="info-box">${ICONS.info}<span>Renseigner une cible calorique (ou la calculer dans l'onglet Calculateur) pour obtenir le débit.</span></div>`;
    }

    // Tableau des débits par palier de progression (5, 10, 15... kcal/kg/j)
    if (poidsNutri){
      const { kcalPerKg } = getTargets();
      const progression = buildProgression(kcalPerKg, state.sriRisk);
      // paliers uniques (évite les doublons quand plusieurs jours partagent le même palier)
      const paliers = [...new Set(progression.map(r => round(r.kcal,2)))];
      resultsHtml += `
      <div class="field-label" style="margin:20px 0 10px;">Débits par palier de progression (${state.sriRisk ? 'protocole SRI' : 'progression standard'})</div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Palier</th><th>kcal/j</th><th>Continu 24h</th><th>Discontinu — vol./3h</th><th>Discontinu — débit</th><th>Protéines</th></tr></thead>
        <tbody>
          ${paliers.map(palier => {
            const kcalJ = palier * poidsNutri;
            const volume = kcalJ / product.kcalPerMl;
            const debitContinu = volume/24;
            const volumeAdmin = volume/3;
            const debitDiscontinu = volumeAdmin/3;
            const prot = volume * (product.protPer100ml/100);
            return `<tr>
              <td class="strong">${palier} kcal/kg/j</td>
              <td>${round(kcalJ)}</td>
              <td>${round(debitContinu,1)} mL/h</td>
              <td>${round(volumeAdmin)} mL</td>
              <td>${round(debitDiscontinu,1)} mL/h</td>
              <td>${round(prot,1)} g/j</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
      <div class="subtext" style="margin-top:8px;">Discontinu = 3 administrations de 3 h/j. Les protéines apportées par jour ne dépendent pas du mode (continu/discontinu), seul le débit horaire change. Paliers et statut SRI repris de l'onglet Calculateur.</div>`;
    }

  } else {
    // Mode "à partir d'un débit"
    resultsHtml = `
      <label class="field" style="margin-bottom:16px; display:block;">
        <span class="field-label">Mode d'administration</span>
        <div class="seg">
          <button data-act="debitDureeType" data-val="continu" class="${state.debitDureeType==='continu'?'active':''}">Continu (sur 24 h)</button>
          <button data-act="debitDureeType" data-val="discontinu" class="${state.debitDureeType==='discontinu'?'active':''}">Discontinu (3 x 3 h)</button>
        </div>
      </label>
      <label class="field" style="margin-bottom:16px; display:block; max-width:260px;">
        <span class="field-label">Débit ${state.debitDureeType==='continu' ? '(sur 24 h)' : 'par administration (sur 3 h)'}</span>
        <div class="input-wrap"><input type="number" id="f-debit-valeur" value="${state.debitValeur}" step="1"><span class="unit">mL/h</span></div>
      </label>`;

    const debitVal = parseFloat(state.debitValeur)||0;

    if (debitVal > 0){
      let volumeTotal, volumeAdmin;
      if (state.debitDureeType === "continu"){
        volumeTotal = debitVal * 24;
      } else {
        volumeAdmin = debitVal * 3;
        volumeTotal = volumeAdmin * 3;
      }
      const kcalJ = volumeTotal * product.kcalPerMl;
      const proteinesJ = volumeTotal * (product.protPer100ml/100);
      const proteinesKg = poidsNutri ? proteinesJ/poidsNutri : null;
      const kcalKg = poidsNutri ? kcalJ/poidsNutri : null;

      resultsHtml += `
      <div class="grid grid-2">
        ${state.debitDureeType==='discontinu' ? `
        <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
          <div class="lbl" style="color:var(--teal);">Volume par administration</div>
          <div class="val" style="color:var(--teal);">${round(volumeAdmin)} <span style="font-size:13px;">mL / 3h</span></div>
        </div>` : ``}
        <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
          <div class="lbl" style="color:var(--teal);">Volume total</div>
          <div class="val" style="color:var(--teal);">${round(volumeTotal)} <span style="font-size:13px;">mL/j</span></div>
        </div>
        <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
          <div class="lbl" style="color:var(--teal);">Apport calorique</div>
          <div class="val" style="color:var(--teal);">${round(kcalJ)} <span style="font-size:13px;">kcal/j</span></div>
          <div class="sub">${kcalKg ? round(kcalKg,1)+' kcal/kg/j' : ''}</div>
        </div>
        <div class="stat">
          <div class="lbl">Protéines apportées</div>
          <div class="val">${round(proteinesJ,1)} <span style="font-size:13px;">g/j</span></div>
        </div>
        <div class="stat">
          <div class="lbl">Protéines / kg</div>
          <div class="val">${proteinesKg ? round(proteinesKg,2) : '—'} <span style="font-size:13px;">g/kg/j</span></div>
        </div>
      </div>`;
    }
  }

  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.calc}</div>
      <div><h2>Débits de nutrition</h2><p class="subtext">Continu ou discontinu, selon le soluté choisi</p></div></div>
    ${sourceTabs}
    ${voieSelector}
    ${produitSelector}
    ${resultsHtml}
    ${!poidsNutri ? `<div class="info-box" style="margin-top:16px;">${ICONS.info}<span>Renseigner taille/poids dans l'onglet Calculateur pour afficher les apports en g/kg/j.</span></div>` : ''}
  </div>`;
}

function bindEvents(){
  document.querySelectorAll('[data-act="tab"]').forEach(el=>el.addEventListener('click', ()=>{ state.tab = el.dataset.val; render(); }));
  document.querySelectorAll('[data-act="sexe"]').forEach(el=>el.addEventListener('click', ()=>{ state.sexe = el.dataset.val; render(); }));
  document.querySelectorAll('[data-act="phase"]').forEach(el=>el.addEventListener('click', ()=>{ state.phaseKey = el.dataset.val; state.kcalRatio = 1; state.eercRehab = false; render(); }));
  document.querySelectorAll('[data-act="microcheck"]').forEach(el=>el.addEventListener('click', ()=>{ const id = el.dataset.val; state.checked[id] = !state.checked[id]; render(); }));
  document.querySelectorAll('[data-act="eercRehab"]').forEach(el=>el.addEventListener('click', ()=>{ state.eercRehab = !state.eercRehab; render(); }));
  document.querySelectorAll('[data-act="debitSource"]').forEach(el=>el.addEventListener('click', ()=>{ state.debitSource = el.dataset.val; render(); }));
  document.querySelectorAll('[data-act="debitVoie"]').forEach(el=>el.addEventListener('click', ()=>{ state.debitVoie = el.dataset.val; state.debitProduitId = DEBIT_PRODUCTS[state.debitVoie][0].id; render(); }));
  document.querySelectorAll('[data-act="debitDureeType"]').forEach(el=>el.addEventListener('click', ()=>{ state.debitDureeType = el.dataset.val; render(); }));

  const fDebitProduit = document.getElementById('f-debit-produit');
  if (fDebitProduit) fDebitProduit.addEventListener('change', e=>{ state.debitProduitId = e.target.value; renderPartial(); });
  const fDebitKcal = document.getElementById('f-debit-kcal');
  if (fDebitKcal) fDebitKcal.addEventListener('input', e=>{ state.debitKcalManuel = e.target.value; debouncedRenderPartial(); });
  const fDebitValeur = document.getElementById('f-debit-valeur');
  if (fDebitValeur) fDebitValeur.addEventListener('input', e=>{ state.debitValeur = e.target.value; debouncedRenderPartial(); });

  const fTaille = document.getElementById('f-taille');
  if (fTaille) fTaille.addEventListener('input', e=>{ state.taille = e.target.value; debouncedRenderPartial(); });
  const fPoids = document.getElementById('f-poids');
  if (fPoids) fPoids.addEventListener('input', e=>{ state.poids = e.target.value; debouncedRenderPartial(); });
  const fRatio = document.getElementById('f-ratio');
  if (fRatio) fRatio.addEventListener('input', e=>{ state.kcalRatio = parseFloat(e.target.value); renderPartial(); });
  const fSri = document.getElementById('f-sri');
  if (fSri) fSri.addEventListener('change', e=>{ state.sriRisk = e.target.checked; renderPartial(); });
}

// Reconstruire l'écran immédiatement après une saisie déstabilise le clavier virtuel
// sur certains navigateurs Android (le champ est détruit puis recréé à chaque frappe).
// On attend une courte pause dans la frappe avant de reconstruire.
let renderDebounceTimer = null;
function debouncedRenderPartial(){
  clearTimeout(renderDebounceTimer);
  renderDebounceTimer = setTimeout(renderPartial, 600);
}

// re-render only the content area, preserving input focus where possible
function renderPartial(){
  const content = document.getElementById('content');
  const activeId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement ? document.activeElement.selectionStart : null;
  content.innerHTML = PANELS[state.tab]();
  bindEvents();
  if (activeId){
    const el = document.getElementById(activeId);
    if (el){ el.focus(); if (selStart!=null && el.setSelectionRange) { try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }
}

render();
</script>
