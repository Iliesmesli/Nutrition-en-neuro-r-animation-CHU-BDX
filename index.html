<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>NAR 2026 — Nutrition</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0B1420; --surface:#101C2C; --elevated:#182742; --elevated2:#1E3050;
    --border:#243450; --borderLight:#324562; --text:#E7EDF6; --textMuted:#C3CFDF; --textFaint:#A3B3CA;
    --teal:#2FD9C4; --tealDim:#134E48; --amber:#F2A93B; --amberDim:#4A3512;
    --red:#EF5D6F; --redDim:#4A1A22; --blue:#5B9BF2; --blueDim:#122A4A; --violet:#A78BFA; --violetDim:#2E2350;
    --fontDisplay:'Space Grotesk',sans-serif; --fontBody:'Inter',sans-serif; --fontMono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--fontBody);
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  body{padding-bottom:env(safe-area-inset-bottom); padding-top:env(safe-area-inset-top);}
  #app{max-width:720px;margin:0 auto;padding:20px 16px 40px;}
  h1,h2{font-family:var(--fontDisplay); margin:0;}
  h1{font-size:22px; font-weight:600;}
  h2{font-size:17px; font-weight:600;}
  p{margin:0;}
  .eyebrow{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .badge{font-family:var(--fontMono); font-size:12px; font-weight:600; letter-spacing:.5px; color:var(--teal); background:var(--tealDim); padding:2px 8px; border-radius:6px;}
  .subtext{font-size:13px; line-height:1.5; color:var(--textFaint);}
  .why{font-size:13px; line-height:1.55; color:var(--textMuted); margin-top:8px; padding:8px 10px; border-left:2px solid var(--teal); background:rgba(127,127,127,.06); border-radius:0 8px 8px 0;}
  .why b{color:var(--teal); font-weight:600;}
  .why summary{cursor:pointer; list-style:none;}
  .why summary::-webkit-details-marker{display:none;}
  .why summary::after{content:' ▸'; color:var(--teal);}
  .why[open] summary::after{content:' ▾';}
  .why-t{margin-top:4px;}
  .card-chev{margin-left:auto; color:var(--textFaint); font-size:14px; padding:4px 2px; transition:transform .2s; align-self:center;}
  .card.collapsed .card-chev{transform:rotate(-90deg);}
  .card.collapsed > .card-body{display:none;}
  .card.collapsed > .section-title{margin-bottom:0;}
  .card > .section-title{cursor:pointer;}
  .grp{display:flex; align-items:baseline; gap:8px; margin:22px 2px 10px; }
  .grp .g1{font-family:var(--fontDisplay); font-size:18px; font-weight:700; color:var(--teal);}
  .grp .g2{font-size:13px; color:var(--textFaint);}
  .seg.seg-sm button{font-size:12.5px; padding:9px 2px;}
  .golink{color:var(--teal); text-decoration:underline; text-underline-offset:2px; cursor:pointer; white-space:nowrap;}
  .flash{box-shadow:0 0 0 2px var(--teal); transition:box-shadow .3s;}
  header{margin-bottom:22px;}

  nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; -ms-overflow-style:none; scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  .tab-btn{display:flex; align-items:center; gap:6px; padding:10px 14px; border-radius:10px; font-size:14px; font-weight:500;
    font-family:var(--fontBody); background:transparent; color:var(--textMuted); border:1px solid transparent; white-space:nowrap; flex-shrink:0;}
  .tab-btn.active{background:var(--elevated2); color:var(--teal); border-color:var(--borderLight);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:18px;}
  .section-title{display:flex; align-items:flex-start; gap:12px; margin-bottom:18px;}
  .icon-box{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:var(--elevated); color:var(--teal); flex-shrink:0;}
  .grid{display:grid; gap:12px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  @media(min-width:520px){ .grid-4{grid-template-columns:repeat(4,1fr);} }

  label.field{display:block;}
  .field-label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--textFaint); margin-bottom:6px;}
  .input-wrap{display:flex; align-items:center; border:1px solid var(--borderLight); background:var(--elevated); border-radius:10px; overflow:hidden;}
  .input-wrap input{flex:1; border:none; background:transparent; color:var(--text); font-family:var(--fontMono); font-size:15px; padding:10px 12px; outline:none; width:100%;}
  .input-wrap .unit{padding:0 12px; font-size:13px; color:var(--textFaint);}
  .seg{display:flex; border:1px solid var(--borderLight); border-radius:10px; overflow:hidden;}
  .seg button{flex:1; padding:10px; font-size:14px; font-weight:500; font-family:var(--fontBody); background:var(--elevated); color:var(--textMuted); border:none;}
  .seg button.active{background:var(--elevated2); color:var(--teal);}

  .stat{border-radius:12px; padding:14px; background:var(--elevated);}
  .stat .lbl{font-size:12px; color:var(--textFaint);}
  .stat .val{font-size:22px; font-family:var(--fontMono); margin-top:4px; color:var(--text);}
  .stat .sub{font-size:12px; font-family:var(--fontMono); color:var(--textFaint); margin-top:2px;}

  .phase-btn{text-align:left; border-radius:12px; padding:12px; background:var(--elevated); border:1px solid var(--borderLight); cursor:pointer;}
  .phase-btn .t{font-size:14px; font-weight:600; font-family:var(--fontDisplay);}
  .phase-btn .s{font-size:12px; color:var(--textFaint); margin-top:3px; line-height:1.3;}

  input[type=range]{width:100%; margin-top:8px; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--elevated2);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--teal); cursor:pointer;}

  .info-box{display:flex; gap:8px; font-size:13px; padding:10px 12px; border-radius:10px; background:var(--elevated); color:var(--textMuted); line-height:1.5; margin-top:16px;}
  .warn-box{display:flex; gap:8px; font-size:13px; padding:10px 12px; border-radius:10px; margin-top:14px; line-height:1.5;}

  .row-item{display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:10px; padding:12px; background:var(--elevated); margin-bottom:8px;}
  .row-item .t{font-size:14px; font-weight:500;}
  .row-item .s{font-size:12.5px; line-height:1.5; color:var(--textFaint); margin-top:2px;}
  .row-item .badgeval{font-size:13px; font-weight:600; font-family:var(--fontDisplay); padding:6px 10px; border-radius:8px; text-align:right; flex-shrink:0;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--textFaint); font-weight:600; padding-bottom:8px; font-size:12px; text-transform:uppercase;}
  td{padding:9px 4px 9px 0; border-top:1px solid var(--border); color:var(--textMuted); line-height:1.45;}
  td.strong{color:var(--text); font-weight:500;}

  summary::-webkit-details-marker{display:none;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:13px; padding:8px 12px; border-radius:999px; border:1px solid var(--borderLight); background:var(--elevated); color:var(--textMuted); cursor:pointer; font-family:var(--fontBody);}
  .chip.active{background:var(--tealDim); border-color:var(--teal); color:var(--teal);}
  .checkrow{display:flex; align-items:flex-start; gap:10px; border-radius:10px; padding:12px; background:var(--elevated); margin-bottom:8px; cursor:pointer;}
  .checkrow.checked{background:var(--elevated2);}
  .checkrow input{width:17px; height:17px; margin-top:2px; accent-color:var(--teal); flex-shrink:0;}
  .checkrow .t{font-size:14px; font-weight:500;}
  .checkrow .s{font-size:13px; color:var(--textMuted); margin-top:2px;}

  .step{display:flex; gap:10px; margin-bottom:14px; font-size:14px; line-height:1.5;}
  .step .n{display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--elevated2); color:var(--teal); font-family:var(--fontMono); font-size:12px; font-weight:600; flex-shrink:0; margin-top:1px;}

  .bars{display:flex; gap:5px; flex-wrap:wrap;}
  .bar-col{width:14.5%; min-width:44px; display:flex; flex-direction:column; align-items:center;}
  .bar-track{width:100%; height:88px; background:var(--elevated); border-radius:6px 6px 0 0; display:flex; align-items:flex-end; overflow:hidden;}
  .bar-fill{width:100%;}
  .bar-day{font-size:9px; font-family:var(--fontMono); color:var(--textFaint); margin-top:5px;}
  .bar-val{font-size:10px; font-family:var(--fontMono); font-weight:500;}

  .chk-wrap{display:flex; align-items:center; gap:9px; margin-bottom:16px; width:fit-content;}
  .chk-wrap input{width:16px;height:16px;accent-color:var(--red);}
  .chk-wrap span{font-size:14px;}

  footer{margin-top:14px; text-align:center; font-size:12px; color:var(--textFaint); line-height:1.5;}
  .brand-footer{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:34px; padding-top:18px; border-top:1px solid var(--border);}
  .brand-badge{display:flex; align-items:center; justify-content:center; width:112px; height:112px; border-radius:22px; background:var(--surface); border:1px solid var(--border); flex-shrink:0;}
  .brand-badge img{max-width:84px; max-height:84px; object-fit:contain;}
  .brand-slot{font-size:8px; line-height:1.2; text-align:center; color:var(--textFaint); font-family:var(--fontBody); border:1px dashed var(--borderLight); border-radius:8px; width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
  svg.ic{width:18px;height:18px;}
</style>
</head>

/* ---------------- HELPERS ---------------- */
const round = (n, d=0) => { const f = Math.pow(10,d); return Math.round(n*f)/f; };
const calcIMC = (poids, tailleCm) => { const t = tailleCm/100; return poids/(t*t); };
// Poids : RFE SFAR/HAS 2026 — poids réel sec (antérieur à l'épisode) ; si IMC > 30 : poids ajusté
// Poids idéal = 25 × T² ; Poids ajusté = Poids idéal + 0,25 × (Poids réel − Poids idéal)
const calcPoidsIdeal = (tailleCm) => { const t = tailleCm/100; return 25*t*t; };
function calcPoidsNutritionnel(poidsReel, tailleCm){
  const imc = calcIMC(poidsReel, tailleCm);
  const pi = calcPoidsIdeal(tailleCm);
  if (imc <= 30) return { imc, pi, poidsNutritionnel: poidsReel, ajuste:false };
  const poidsAjuste = pi + 0.25*(poidsReel - pi);
  return { imc, pi, poidsNutritionnel: poidsAjuste, ajuste:true };
}
// Progression par paliers de 5 kcal/kg/j (≈ 25 % d'une cible de 20 kcal/kg/j), à partir de 10 kcal/kg/j
// Sans risque de SRI : palier suivant toutes les 24 h si bonne tolérance.
// Risque de SRI : 10 kcal/kg/j pendant 3 jours, puis paliers de 48 h à 15 et 20 kcal/kg/j (cible en 7 à 10 jours).
function buildProgression(kcalTargetPerKg, sriRisk){
  const rows = [];
  const PLATEAU_VALUES = [15, 20];
  function pushStep(day, kcal){
    rows.push({day, kcal});
    if (sriRisk && PLATEAU_VALUES.includes(kcal)) rows.push({day: day+1, kcal});
    return (sriRisk && PLATEAU_VALUES.includes(kcal)) ? day+2 : day+1;
  }
  let day=1; let current=Math.min(10,kcalTargetPerKg);
  const firstDays = sriRisk ? 3 : 1;
  while(day<=firstDays){ rows.push({day, kcal:current}); day++; }
  while(current<kcalTargetPerKg && day<=16){ current=Math.min(current+5,kcalTargetPerKg); day = pushStep(day, current); }
  return rows;
}
// Apports non nutritionnels (kcal/j) — RFE SFAR/HAS 2026, Tableau 2 et Figure 5
function calcNonNutritionnel(){
  const num = v => Math.max(0, parseFloat(v)||0);
  const propofol = num(state.propofolDebit)*24*1.1;           // 1,1 kcal/mL (1 % comme 2 %)
  const glucose = (num(state.g25)*0.025 + num(state.g5)*0.05 + num(state.g10)*0.10 + num(state.g30)*0.30)*4; // 4 kcal/g
  // Citrate : Qsg (mL/min) × dose (mmol/L de sang) × 1,44 × 0,5 × 0,59
  const citrate = state.renal==='eerc' ? num(state.citQsg)*num(state.citDose)*1.44*0.5*0.59 : 0;
  return { propofol, glucose, citrate, total: propofol+glucose+citrate };
}
function why(t){ return t ? `<details class="why"><summary><b>Pourquoi ?</b></summary><div class="why-t">${t}</div></details>` : ''; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- SHARED: cibles nutritionnelles ---------------- */
function getTargets(){
  const tailleN = parseFloat(state.taille)||0;
  const poidsN = parseFloat(state.poids)||0;
  const phase = PHASES[state.phaseKey];
  const renal = RENAL[state.renal];
  const result = (tailleN && poidsN) ? calcPoidsNutritionnel(poidsN, tailleN) : null;
  const kcalPerKg = phase.kcalMin + (phase.kcalMax-phase.kcalMin)*state.kcalRatio;
  let protPerKg = phase.protMin + (phase.protMax-phase.protMin)*state.kcalRatio;
  const renalActive = state.phaseKey==='rehabilitation' && renal.protRehab!=null;
  if (renalActive) protPerKg = renal.protRehab;
  const kcalTarget = result ? kcalPerKg*result.poidsNutritionnel : 0;
  const protTarget = result ? protPerKg*result.poidsNutritionnel : 0;
  const nn = calcNonNutritionnel();
  const kcalNutri = Math.max(0, kcalTarget - nn.total);
  return { tailleN, poidsN, phase, renal, renalActive, result, kcalPerKg, protPerKg, kcalTarget, protTarget, nn, kcalNutri };
}

    <div class="info-box">${ICONS.info}<span>Passer au palier suivant uniquement si la tolérance digestive et métabolique est bonne (K, phosphate, Mg quotidiens J1–J5) ; sinon rester au palier. <strong>Si réaggravation</strong> (reprise ou majoration des catécholamines) : revenir aux cibles du choc (≤ 10 kcal/kg/j, ≤ 0,4 g/kg/j).</span></div>

  </div>

  <div class="card">

    ${step('', "<strong>Surveillance</strong> : K, phosphate, Mg <strong>tous les jours de J1 à J5</strong> de la nutrition. Si NP ou propofol à dose élevée : bilan hépatique ×2/semaine et triglycérides ×1/semaine ; si TG &gt; 4,5 mmol/L, réduire ou suspendre les lipides / le propofol.")}

  </div>

  <div class="card">

      <div><div class="field-label" style="margin-bottom:6px;">Critères étiologiques</div>

    <div class="info-box">${ICONS.info}<span><strong>Sévérité</strong> (albuminémie) : modérée 30–35 g/L, sévère ≤ 30 g/L. Tout patient admis en soins critiques est à risque nutritionnel.</span></div>

  return html;
}

const MICRO_MODES = [
  { v:"np", label:"Nutrition parentérale (exclusive ou complémentaire)" },
  { v:"ne_low", label:"Nutrition entérale < 1500 kcal/j" },
  { v:"ne_high", label:"Nutrition entérale ≥ 1500 kcal/j" },
  { v:"po_low", label:"Alimentation orale insuffisante" },
  { v:"po_ok", label:"Alimentation orale suffisante" }
];
function microPlan(){
  const m = state.microMode, c = state.checked;
  if (!m) return null;
  const items = [], notes = [];
  const add = (nom, dose, why, opt=false) => items.push({nom, dose, why, opt});
  // Polyvitamines / oligo-éléments
  if (c.eerc){
    add("Cernevit", "10 mL/j", "EERc : pertes dans l'effluent (dose doublée)");
    add("Nutryelt", "20 mL/j", "EERc : pertes dans l'effluent (dose doublée)");
  } else if (m==="np"){
    add("Cernevit", "5 mL/j", "Toute NP, dès J1");
    add("Nutryelt", "10 mL/j", "Toute NP, dès J1");
  } else if (m==="ne_low" || (m==="po_low" && (c.ethylique || c.sri)) || (c.malabsorption && m!=="po_ok")){
    const why = m==="ne_low" ? "NE < 1500 kcal/j" : (c.malabsorption && m!=="po_low" ? "Malabsorption : voie IV" : "Apports < 1500 kcal/j chez un patient à risque (SRI / alcool)");
    add("Cernevit", "5 mL/j", why);
    add("Nutryelt", "10 mL/j", why);
  } else if (m==="po_low"){
    add("Alvityl Vitalité", "1 cp/j", "Alimentation orale insuffisante");
  } else if (m==="ne_high"){
    notes.push("NE ≥ 1500 kcal/j : le soluté couvre les besoins, pas de polyvitamines ni d'oligo-éléments en plus.");
  }
  // Thiamine
  if (c.ethylique){
    add("Vitamine B1", "500 mg/j pendant 5 j", "Éthylisme chronique");
    add("Vitamine B6", "250 mg/j pendant 5 j", "Éthylisme chronique (ou PrinciB 2 cp/j si voie orale possible)");
  } else if (c.sri){
    add("Vitamine B1", "200–300 mg/j pendant 5 j", "Risque de SRI");
  } else if (c.eerc){
    add("Vitamine B1", "200 mg/j", "EERc");
  } else {
    add("Vitamine B1", "100–300 mg/j jusqu'à J3–J5", "Tout patient de réanimation / post-op lourd");
  }
  // Sélénium
  if (c.eerc) add("Sélénium", "100 µg/j", "EERc");
  else if (m==="np") add("Sélénium", "100 µg/j pendant 5 j", "NP");
  else if (m==="ne_low" || m==="po_low") add("Sélénium", "100 µg/j pendant 5 j", "Si patient grave (max 2 semaines)", true);
  // Autres
  if (m==="np" || c.cholestase) add("Vitamine K1 IV", "5 mg x2/sem", m==="np" ? "Absente des mélanges de NP et du Cernevit" : "Cholestase importante");
  if (c.cotrimoxazole) add("Acide folique", "5 mg/j", "Pendant toute la durée du cotrimoxazole");
  if (c.escarre) add("Zinc", "10–30 mg/j", "Escarre sévère / cicatrisation difficile");
  if (c.cirrhose){
    const pn = (()=>{ const t=parseFloat(state.taille)||0, pr=parseFloat(state.poids)||0; return (t&&pr) ? calcPoidsNutritionnel(pr,t).poidsNutritionnel : null; })();
    add("Zinc (élément) PO", "0,5–1 mg/kg/j pendant 3–4 mois" + (pn ? ` (${Math.round(pn*0.5)}–${Math.round(pn)} mg/j)` : ""), "Cirrhose : seulement si carence confirmée ou suspectée", true);
    notes.push("<strong>Cirrhose – suspecter une carence en zinc</strong> devant : dysgueusie ou agueusie, anorexie, lésions cutanées (dermatite autour de la bouche, du nez et des extrémités), alopécie, retard de cicatrisation, diarrhée, infections répétées. Confirmer par un zinc plasmatique interprété avec la CRP et l'albumine (abaissé par l'hypoalbuminémie). Le zinc n'améliore pas l'encéphalopathie hépatique.");
  }
  // Notes
  if (items.some(i=>i.nom==="Cernevit")) notes.push("Cernevit et Nutryelt : IVL sur 2 h, à l'abri de la lumière.");
  if (c.eerc){
    notes.push("EERc &gt; 15 jours : doser B1, B9, vitamine C, Se, Cu, Zn (avec CRP), à répéter toutes les 2 semaines si l'EERc se prolonge. Cuivre bas ou EERc prolongée : ajouter du cuivre IV (l'ESPEN suggère environ 3 mg/j).");
    notes.push("EERc &gt; 30 jours ou cholestase : Nutryelt ×2 apporte 110 µg/j de manganèse, non épuré par l'EER (risque d'accumulation) : envisager Nutryelt ×1 + sélénium + cuivre.");
  }
  if (m==="np") notes.push("NP &gt; 15 jours : doser B1, B9, Se, Cu, Zn (avec CRP et albumine). B12 seulement si anémie macrocytaire. NP &gt; 30 jours avec atteinte hépatique : doser le manganèse.");
  const w = [];
  if (m==="np") w.push("Les mélanges de NP ne contiennent ni vitamines ni oligo-éléments : sans ajout, carence dès les premiers jours.");
  if (m==="ne_low") w.push("Sous 1500 kcal/j, le volume de soluté entéral ne couvre pas les apports journaliers en vitamines et oligo-éléments.");
  if (m==="ne_high") w.push("À partir de 1500 kcal/j, le soluté apporte les apports journaliers recommandés : supplémenter n'apporte rien.");
  w.push("Thiamine (B1) : cofacteur du métabolisme du glucose, réserves faibles, consommée par la renutrition (risque d'encéphalopathie, d'acidose lactique, de défaillance cardiaque).");
  if (c.eerc) w.push("EERc : les micronutriments hydrosolubles et certains oligo-éléments passent dans l'effluent.");
  return { items, notes, why: w.join(' ') };
}

      <div class="stat"><div class="val" style="font-size:20px;">Albumine <span style="font-size:12px; color:var(--textFaint); font-weight:400;">(facultatif)</span></div><div class="sub" style="font-size:12px; margin-top:4px;">t½ ≈ 15-20 jours</div></div>
    </div>
  </div>`;
}

/* ---------------- RENDER: COMPLICATIONS ---------------- */

function renderCompl(){

    ${step(2,"Pause d'alimentation 2 h, puis reprise à 2/3 du débit.")}
    ${step(3,"Si récidive : nouvelle pause de 2 h + prokinétiques — <strong>érythromycine 100–250 mg x3/j IVL</strong> (3–7 mg/kg/j) et/ou <strong>métoclopramide 10 mg x3/j IVL</strong>, <strong>pendant 48–72 h</strong> (tachyphylaxie). Mesurer le QT avant introduction.")}
    ${step(4,"Si échec des prokinétiques : sonde post-pylorique ou jéjunale (risque de distension abdominale, ischémie mésentérique).")}

    ${step(1,"Éliminer une autre étiologie que la NE : fausse diarrhée sur fécalome, antibiothérapie, ischémie mésentérique, infection à C. difficile (GDH+ et toxine+, ou PCR+ ; à rechercher devant toute diarrhée nosocomiale &gt; 48 h après admission).")}
    ${step(2,"<strong>Racécadotril (Tiorfan) 100 mg x3/j</strong> + <strong>Lactéol 100 mg x2/j</strong> (pas de lopéramide sans coproculture C. difficile négative).")}

    <div class="info-box">La pose d'une sonde rectale (Flexi-Seal) ne s'envisage qu'en cas de lésions cutanées ou de souillures très fréquentes, et doit être gardée le moins longtemps possible (risque d'incontinence). En cas de Flexi-Seal, maintenir les antidiarrhéiques ; les laxatifs pour entretenir la diarrhée ne sont indiqués que pour maintenir la sonde à visée de protection d'une escarre sacrée.</div>

    ${step(2,"Soluté à base de fibres mixtes (gomme de guar, amidon, cellulose, pectine) en 1<sup>re</sup> intention : Nutrison Prot NRJ Multifibres.")}
    ${step(3,"<strong>Massages abdominaux protocolisés</strong> (" + go('protocole ci-dessous', {tab:'compl', id:'c-massage'}) + "), en l'absence de contre-indication.")}
    ${step(4,"Laxatifs curatifs (<strong>pas de laxatif prophylactique systématique</strong>) : <strong>macrogol</strong> 20 g matin, <strong>trimébutine</strong> (Debridat) 100 mg x3–6/j, <strong>bisacodyl</strong> (Dulcolax) 10 mg matin, pruneaux matin/midi ou jus de pruneaux 200 mL matin/midi ; <strong>naloxégol</strong> (Moventig) 25 mg matin ou <strong>méthylnaltrexone</strong> (Relistor) SC 12 mg/2j si constipation sous morphiniques (pas en systématique).")}
    ${step(5,"Si insuffisant : <strong>Gastrografine</strong> 100 mL une fois, PO ou SNG (ASP inutile).")}

    ${step(2,"Si insuffisant : lavement « paraffine-eau tiède » quotidien = 3 L de <strong>NaCl 0,9 %</strong> tiède contenant 3 <strong>Lansoyl</strong>, à connecter sur une sonde rectale.")}

}

/* ---------------- RENDER: SRI ---------------- */
function renderSri(){
  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.alert}</div>
      <div><h2>Syndrome de renutrition inappropriée</h2><p class="subtext">Tout patient hospitalisé en réanimation depuis &gt; 48 h est à risque</p></div></div>
    <div class="grid grid-2">
      <div class="stat"><div class="field-label" style="margin-bottom:8px;">Conséquences possibles</div>
        <div style="font-size:13px; line-height:1.6;">Hypophosphatémie, hypomagnésémie, hypokaliémie, hyperglycémie, béri-béri (carence en thiamine), rétention hydrosodée ou défaillances d'organe (cardiaque, neurologique, respiratoire, rénale, hépatique, musculaire, hématologique). L'hypophosphatémie est la conséquence biologique la plus grave.</div></div>
      <div class="stat"><div class="field-label" style="margin-bottom:8px;">Prévention</div>
        <div style="font-size:13px; line-height:1.6;">Corriger K, phosphate et Mg <strong>avant</strong> d'initier la nutrition. Début à 10 kcal/kg/j pendant 1 à 3 jours, puis +5 kcal/kg/j toutes les 24–48 h jusqu'à la cible (7 à 10 jours). Thiamine (B1) 200–300 mg/j pendant 5 jours. Micronutriments : Cernevit 5 mL et Nutryelt 10 mL/j tant que les apports sont &lt; 1500 kcal/j. Prudence avec les apports caloriques non nutritionnels.</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.clip}</div>
      <div><h2>Facteurs de risque</h2><p class="subtext">RFE SFAR/HAS 2026</p></div></div>
    <div class="stat" style="background:var(--amberDim); border:1px solid rgba(242,169,59,.35);">
      ${SRI_FACTEURS.map(c=>`<div style="font-size:13px; line-height:1.6; margin-bottom:6px; color:var(--text);">— ${c}</div>`).join('')}
    </div>
  </div>

  <div class="card" id="c-phos">
    <div class="section-title"><div class="icon-box">${ICONS.syringe}</div>
      <div><h2>Correction de l'hypophosphatémie</h2><p class="subtext">Précautions à prendre pendant la renutrition</p></div></div>
    <div class="warn-box" style="background:var(--amberDim); color:var(--amber); margin-top:0;">${ICONS.alert}<span><strong>Pas de majoration de la nutrition en cas d'hypophosphatémie.</strong></span></div>
    <div class="row-item" style="margin-top:12px;">
      <div><div class="t">Phosphatémie &lt; 0,65 mM</div><div class="s">Avant ou en cours de renutrition · <strong>seulement si SRI avéré</strong> (autres critères diagnostiques présents), pas sur une hypophosphatémie isolée</div></div>
      <div class="badgeval" style="color:var(--amber); background:var(--amberDim); text-align:right;">Réduire à 500 kcal/j x2j, puis +5 kcal/kg/j jusqu'à la cible</div>
    </div>
    <div class="row-item">
      <div><div class="t">Phosphatémie &lt; 0,4 mM</div><div class="s">Hypophosphatémie sévère</div></div>
      <div class="badgeval" style="color:var(--red); background:var(--redDim); text-align:right;">Suspension de la nutrition</div>
    </div>
    <div class="info-box" style="border:1px solid rgba(239,93,111,.35);"><span><strong>Phocytan</strong> 0,66 mM/mL (1800 mOsm/L) : 10 mL = 300 mg de sodium (= SSH 3 %) + 1 g de glucose. Attention aux recharges : <strong style="color:var(--red);">ne pas dépasser 20 mmol/h, soit 30 mL/h</strong>.</span></div>
    <div class="info-box"><span><strong>Surveillance :</strong> K, phosphate, Mg tous les jours de J1 à J5 de la nutrition (tout patient) ; iono plasmatique au minimum x2/j si SRI avéré. ECG si trouble ionique sévère.</span></div>
  </div>`;
}

/* ---------------- RENDER: DEBITS ---------------- */
function renderDebit(){
  const products = DEBIT_PRODUCTS[state.debitVoie];
  const product = products.find(p => p.id === state.debitProduitId) || products[0];
  const { result, kcalNutri: kcalTarget, kcalTarget: kcalBrut, nn } = getTargets();
  const poidsNutri = result ? result.poidsNutritionnel : null;

  const sourceTabs = `
    <div class="seg" style="margin-bottom:18px;">
      <button data-act="debitSource" data-val="cible" class="${state.debitSource==='cible'?'active':''}">À partir de la cible calorique</button>
      <button data-act="debitSource" data-val="debit" class="${state.debitSource==='debit'?'active':''}">À partir d'un débit</button>
    </div>`;

  const voieSelector = `
    <div class="seg" style="margin-bottom:16px;">
      <button data-act="debitVoie" data-val="enterale" class="${state.debitVoie==='enterale'?'active':''}">Entérale</button>
      <button data-act="debitVoie" data-val="parenterale" class="${state.debitVoie==='parenterale'?'active':''}">Parentérale</button>
    </div>`;

  const produitSelector = `
    <label class="field" style="margin-bottom:16px; display:block;">
      <span class="field-label">Soluté</span>
      <select id="f-debit-produit" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--borderLight); background:var(--elevated); color:var(--text); font-family:var(--fontBody); font-size:14px;">
        ${products.map(p => `<option value="${p.id}" ${p.id===product.id?'selected':''}>${p.nom} — ${p.kcalPerMl} kcal/mL, ${p.protPer100ml} g prot/100mL</option>`).join('')}
      </select>
      <div class="subtext" style="margin-top:6px;">${product.note} · Osmolarité ${product.osmolarite} mOsm/L</div>
    </label>`;

  let resultsHtml = "";

  if (state.debitSource === "cible"){
    const kcalManuel = state.debitKcalManuel !== "" ? parseFloat(state.debitKcalManuel) : kcalTarget;

    resultsHtml = `
      <label class="field" style="margin-bottom:14px; display:block;">
        <span class="field-label">Cible calorique (kcal/j)</span>
        <div class="input-wrap"><input type="number" id="f-debit-kcal" value="${state.debitKcalManuel !== "" ? state.debitKcalManuel : (kcalTarget ? round(kcalTarget) : "")}" placeholder="${kcalTarget ? round(kcalTarget) : 'Renseigner la cible dans Calculateur'}"><span class="unit">kcal/j</span></div>
        <div class="subtext" style="margin-top:6px;">${kcalTarget ? `Pré-rempli depuis l'${go('onglet Calculateur', {tab:'calc', id:'c-nn'})} : nutrition à prescrire, apports non nutritionnels déduits (${round(kcalTarget)} kcal/j)` : "Renseigner taille/poids dans l'onglet Calculateur pour pré-remplir"}</div>
      </label>
      <label class="field" style="margin-bottom:16px; display:block;">
        <span class="field-label">Mode d'administration</span>
        <div class="seg">
          <button data-act="debitDureeType" data-val="continu" class="${state.debitDureeType==='continu'?'active':''}">Continu (sur 24 h)</button>
          <button data-act="debitDureeType" data-val="discontinu" class="${state.debitDureeType==='discontinu'?'active':''}">Discontinu (3 x 3 h)</button>
        </div>
      </label>`;

    // Deux scénarios : avec déduction des apports non nutritionnels (référence) et sans déduction
    const scenarios = [];
    if (kcalManuel && !isNaN(kcalManuel) && kcalManuel > 0){
      const withNN = state.debitKcalManuel === "" && nn.total > 0;
      scenarios.push({ kcal:kcalManuel, titre: withNN ? `Apports non nutritionnels déduits (${round(nn.total)} kcal/j)` : '', main:true });
      if (withNN && kcalBrut > 0) scenarios.push({ kcal:kcalBrut, titre:'Sans tenir compte des apports non nutritionnels', main:false });
    }
    const statBox = (lbl, val, unit, main) => `
          <div class="stat" ${main ? 'style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);"' : ''}>
            <div class="lbl" ${main ? 'style="color:var(--teal);"' : ''}>${lbl}</div>
            <div class="val" ${main ? 'style="color:var(--teal);"' : ''}>${val} <span style="font-size:13px;">${unit}</span></div>
          </div>`;
    scenarios.forEach(sc => {
      const volumeTotal = sc.kcal / product.kcalPerMl;
      const proteinesJ = volumeTotal * (product.protPer100ml/100);
      const proteinesKg = poidsNutri ? proteinesJ/poidsNutri : null;
      const head = sc.titre ? `<div class="field-label" style="margin:${sc.main?'8px':'22px'} 0 6px; ${sc.main?'color:var(--teal);':''}">${sc.titre} · ${round(sc.kcal)} kcal/j</div>` : '';
      if (state.debitDureeType === "continu"){
        resultsHtml += head + `
        <div class="grid grid-2" style="margin-top:8px;">
          ${statBox('Volume total', round(volumeTotal), 'mL/j', sc.main)}
          ${statBox('Débit continu (24 h)', round(volumeTotal/24,1), 'mL/h', sc.main)}
          ${statBox('Protéines apportées', round(proteinesJ,1), 'g/j', false)}
          ${statBox('Protéines / kg', proteinesKg ? round(proteinesKg,2) : '—', 'g/kg/j', false)}
        </div>`;
      } else {
        const volumeAdmin = volumeTotal / 3;
        resultsHtml += head + `
        ${sc.main ? '<div class="subtext" style="margin-bottom:10px;">3 administrations par jour, chacune sur 3 h</div>' : ''}
        <div class="grid grid-2" style="margin-top:8px;">
          ${statBox('Volume par administration', round(volumeAdmin), 'mL / 3h', sc.main)}
          ${statBox('Débit horaire', round(volumeAdmin/3,1), 'mL/h', sc.main)}
          ${statBox('Volume total', round(volumeTotal), 'mL/j', false)}
          ${statBox('Protéines apportées', round(proteinesJ,1), 'g/j', false)}
        </div>`;
      }
    });
    if (!scenarios.length){
      resultsHtml += `<div class="info-box">${ICONS.info}<span>Renseigner une cible calorique (ou la calculer dans l'${go('onglet Calculateur', {tab:'calc'})}) pour obtenir le débit.</span></div>`;
    }

    if (scenarios.length) resultsHtml += why("Débit = calories à apporter ÷ densité du soluté (kcal/mL) ÷ durée d'administration. Les calories non nutritionnelles déjà reçues (propofol, glucose, citrate) sont retirées de la cible pour ne pas la dépasser ; la ligne « sans déduction » montre ce qu'on prescrirait en les ignorant.");
    // Tableau des débits par palier de progression (5, 10, 15... kcal/kg/j)
    if (poidsNutri){
      const { kcalPerKg } = getTargets();
      const progression = buildProgression(kcalPerKg, state.sriRisk);
      // paliers uniques (évite les doublons quand plusieurs jours partagent le même palier)
      const paliers = [...new Set(progression.map(r => round(r.kcal,2)))];
      resultsHtml += `
      <div class="field-label" style="margin:20px 0 10px;">Débits par palier de progression (${state.sriRisk ? 'protocole SRI' : 'progression standard'})${nn.total>0 ? ` · apports non nutritionnels : ${round(nn.total)} kcal/j` : ''}</div>
      <div style="overflow-x:auto;">
      ${nn.total>0 ? `
      <table>
        <thead><tr><th>Palier (total)</th><th>Non nutritionnel déduit</th><th>Sans déduction</th></tr></thead>
        <tbody>
          ${paliers.map(palier => {
            const cell = kcalJ => {
              const volume = kcalJ / product.kcalPerMl;
              const debit = state.debitDureeType==='continu' ? volume/24 : volume/9;
              const prot = volume * (product.protPer100ml/100);
              return `<strong>${round(debit,1)} mL/h</strong>${state.debitDureeType==='continu' ? '' : ` (${round(volume/3)} mL/3h)`}<br><span class="subtext">${round(kcalJ)} kcal · ${round(prot,1)} g prot</span>`;
            };
            return `<tr>
              <td class="strong">${palier} kcal/kg/j</td>
              <td>${cell(Math.max(0, palier*poidsNutri - nn.total))}</td>
              <td>${cell(palier*poidsNutri)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="subtext" style="margin-top:8px;">Débit ${state.debitDureeType==='continu' ? 'continu sur 24 h' : 'horaire en discontinu (3 administrations de 3 h/j)'}.</div>` : `
      <table>
        <thead><tr><th>Palier</th><th>kcal/j</th><th>Continu 24h</th><th>Discontinu — vol./3h</th><th>Discontinu — débit</th><th>Protéines</th></tr></thead>
        <tbody>
          ${paliers.map(palier => {
            const kcalJ = palier * poidsNutri;
            const volume = kcalJ / product.kcalPerMl;
            const debitContinu = volume/24;
            const volumeAdmin = volume/3;
            const debitDiscontinu = volumeAdmin/3;
            const prot = volume * (product.protPer100ml/100);
            return `<tr>
              <td class="strong">${palier} kcal/kg/j</td>
              <td>${round(kcalJ)}</td>
              <td>${round(debitContinu,1)} mL/h</td>
              <td>${round(volumeAdmin)} mL</td>
              <td>${round(debitDiscontinu,1)} mL/h</td>
              <td>${round(prot,1)} g/j</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
      </div>
      <div class="subtext" style="margin-top:8px;">Discontinu = 3 administrations de 3 h/j. Les protéines apportées par jour ne dépendent pas du mode (continu/discontinu), seul le débit horaire change. Paliers et statut SRI repris de l'onglet Calculateur.</div>`;
    }

  } else {
    // Mode "à partir d'un débit"
    resultsHtml = `
      <label class="field" style="margin-bottom:16px; display:block;">
        <span class="field-label">Mode d'administration</span>
        <div class="seg">
          <button data-act="debitDureeType" data-val="continu" class="${state.debitDureeType==='continu'?'active':''}">Continu (sur 24 h)</button>
          <button data-act="debitDureeType" data-val="discontinu" class="${state.debitDureeType==='discontinu'?'active':''}">Discontinu (3 x 3 h)</button>
        </div>
      </label>
      <label class="field" style="margin-bottom:16px; display:block; max-width:260px;">
        <span class="field-label">Débit ${state.debitDureeType==='continu' ? '(sur 24 h)' : 'par administration (sur 3 h)'}</span>
        <div class="input-wrap"><input type="number" id="f-debit-valeur" value="${state.debitValeur}" step="1"><span class="unit">mL/h</span></div>
      </label>`;

    const debitVal = parseFloat(state.debitValeur)||0;

    if (debitVal > 0){
      let volumeTotal, volumeAdmin;
      if (state.debitDureeType === "continu"){
        volumeTotal = debitVal * 24;
      } else {
        volumeAdmin = debitVal * 3;
        volumeTotal = volumeAdmin * 3;
      }
      const kcalJ = volumeTotal * product.kcalPerMl;
      const proteinesJ = volumeTotal * (product.protPer100ml/100);
      const proteinesKg = poidsNutri ? proteinesJ/poidsNutri : null;
      const kcalKg = poidsNutri ? kcalJ/poidsNutri : null;

      resultsHtml += `
      <div class="grid grid-2">
        ${state.debitDureeType==='discontinu' ? `
        <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
          <div class="lbl" style="color:var(--teal);">Volume par administration</div>
          <div class="val" style="color:var(--teal);">${round(volumeAdmin)} <span style="font-size:13px;">mL / 3h</span></div>
        </div>` : ``}
        <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
          <div class="lbl" style="color:var(--teal);">Volume total</div>
          <div class="val" style="color:var(--teal);">${round(volumeTotal)} <span style="font-size:13px;">mL/j</span></div>
        </div>
        <div class="stat" style="background:var(--tealDim); border:1px solid rgba(47,217,196,.3);">
          <div class="lbl" style="color:var(--teal);">Apport calorique</div>
          <div class="val" style="color:var(--teal);">${round(kcalJ)} <span style="font-size:13px;">kcal/j</span></div>
          <div class="sub">${kcalKg ? round(kcalKg,1)+' kcal/kg/j' : ''}</div>
        </div>
        <div class="stat">
          <div class="lbl">Protéines apportées</div>
          <div class="val">${round(proteinesJ,1)} <span style="font-size:13px;">g/j</span></div>
        </div>
        <div class="stat">
          <div class="lbl">Protéines / kg</div>
          <div class="val">${proteinesKg ? round(proteinesKg,2) : '—'} <span style="font-size:13px;">g/kg/j</span></div>
        </div>
      </div>`;
    }
  }

  if (state.debitSource !== 'cible' && (parseFloat(state.debitValeur)||0) > 0) resultsHtml += why("Calories = débit × durée × densité du soluté. À comparer à la cible de l'" + go('onglet Calculateur', {tab:'calc'}) + ", en tenant compte des apports non nutritionnels.");
  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.calc}</div>
      <div><h2>Débits de nutrition</h2><p class="subtext">Continu ou discontinu, selon le soluté choisi</p></div></div>

function prehabEval(ev){
  const iv = state.poInterv;
  const high = PREOP_INTERV.risque.some(x=>x[0]===iv) || PREOP_INTERV.risqueND.some(x=>x[0]===iv);
  const pi = state.poPrehabInterv;
  const niveau = high ? 'élevé' : (pi==='faible' ? 'faible' : (pi ? 'intermédiaire' : null));
  const age = (ev && ev.age70) || state.poAge65;
  const f = [];
  if (age) f.push('âge ≥ 65–70 ans');
  if (state.poCfs>=5) f.push(`fragilité (CFS ${state.poCfs})`);
  if (state.poASA) f.push('ASA ≥ 3');
  if (ev && (ev.denutri || ev.denutriGN)) f.push('dénutrition');
  if (state.poMuscle) f.push('sarcopénie');
  const indic = niveau==='élevé' || niveau==='intermédiaire';
  return { high, niveau, facteurs:f, indic, renf: indic && f.length>0 };
}
function preopEval(){
  const t = parseFloat(state.taille)||0, p = parseFloat(state.poids)||0, ph = parseFloat(state.poPoidsHab)||0, alb = parseFloat(state.poAlb)||0;
  const age70 = !!state.poFdrList.age;
  if (!t || !p) return null;
  const imc = p/((t/100)**2);
  const perte = ph > p ? (ph-p)/ph*100 : 0;
  const d0 = state.poDelai; // "1m" | "3m" | "6m" | "hab"
  const d = d0==='3m' ? '6m' : d0;
  const iv = state.poInterv;
  const hr = PREOP_INTERV.risque.some(x=>x[0]===iv) || PREOP_INTERV.risqueND.some(x=>x[0]===iv);
  const cardiac = iv === "cardiaque";
  const digestive = PREOP_INTERV.risque.some(x=>x[0]===iv) || iv === "digestive" || iv === "perfo";
  const nonOnco = digestive && state.poNonOnco;
  // HAS
  const pheno = [], severe = [];
  if (imc < (age70 ? 22 : 18.5)) pheno.push(`IMC ${round(imc,1)} &lt; ${age70 ? 22 : 18.5} kg/m²`);
  if (ph){
    if (d==="1m" && perte >= 5) pheno.push(`perte de poids ${round(perte,1)} % en 1 mois (≥ 5 %)`);
    if (d!=="1m" && perte >= 10) pheno.push(`perte de poids ${round(perte,1)} % ${d==="6m" ? "en 6 mois" : "par rapport au poids habituel"} (≥ 10 %)`);
  }
  if (state.poMuscle) pheno.push("réduction de la force ou de la masse musculaire");
  if (age70 ? imc < 20 : imc <= 17) severe.push(`IMC ${age70 ? '&lt; 20' : '≤ 17'} kg/m²`);
  if (ph && ((d==="1m" && perte >= 10) || (d!=="1m" && perte >= 15))) severe.push(`perte de poids ≥ ${d==="1m" ? 10 : 15} %`);
  if (alb && (age70 ? alb < 30 : alb <= 30)) severe.push(`albuminémie ${age70 ? '&lt; 30' : '≤ 30'} g/L`);
  const denutri = pheno.length > 0;
  const severite = !denutri ? null : (severe.length ? "sévère" : "modérée");
  // GN (fiche du protocole)
  const albSeuil = nonOnco ? 35 : 30;
  const sfar = [];
  if (imc < (age70 ? 21 : 18.5)) sfar.push(`IMC &lt; ${age70 ? '21' : '18,5'} kg/m²`);
  if (ph && d==="1m" && perte >= 5) sfar.push("perte de poids ≥ 5 % en 1 mois");
  if (ph && d==="6m" && perte >= 10) sfar.push("perte de poids ≥ 10 % en 6 mois");
  if (alb && alb < albSeuil) sfar.push(`albuminémie &lt; ${albSeuil} g/L`);
  const denutriGN = sfar.length > 0;
  const nFdr = PREOP_FDR_LIST.filter(f=>state.poFdrList[f.id]).length;

  if (alb && alb < 37) card.push("albuminémie &lt; 37 g/L");
  if (imc < 13) cardSev.push("IMC &lt; 13 kg/m²");
  if (ph && (d0==="1m" || d0==="3m") && perte > 20) cardSev.push("amaigrissement &gt; 20 % en 3 mois");
  if (state.poApportsNeg) cardSev.push("apports oraux négligeables depuis ≥ 15 jours");
  return { imc, perte, pheno, severe, denutri, severite, sfar, denutriGN, albSeuil, nFdr, gn, hr, cardiac, digestive, card, cardSev, age70 };
}

function survPlan(){
  const m = state.survMode, c = state.survChecked;
  if (!m) return null;
  const items = [], seuils = [];
  const add = (quoi, freq, why, rank) => { if (!items.some(i=>i.quoi===quoi)) items.push({quoi, freq, why, rank}); };
  // Biologie
  if (c.sri) add("Ionogramme (K), phosphate, magnésium", "×2/j", "SRI avéré", 0);
  if (c.eerc) add("Ionogramme (K), phosphate, magnésium", "1×/j pendant toute l'EERc", "EERc : pertes dans l'effluent", 1);
  add("Ionogramme (K), phosphate, magnésium", "1×/j de J1 à J5", c.sririsk ? "Risque de SRI : corriger les déficits avant de débuter" : "Début de nutrition : dépistage du SRI", 1);
  if (c.sri || c.sririsk) add("ECG", "si trouble ionique sévère", "SRI", 2);
  if (c.ira) add("Urée plasmatique", "1×/j", "IRenA sans EER : charge azotée (cible protéique modérée)", 1);
  if (m==="np" || c.propofol){
    const why = m==="np" && c.propofol ? "NP + propofol" : (m==="np" ? "Nutrition parentérale" : "Propofol à dose élevée");
    add("Bilan hépatique" + (m==="np" ? " et TP" : ""), "×2/semaine", why, 3);
    add("Triglycérides", "×1/semaine", why, 4);
    seuils.push("<strong>TG &gt; 4,5 mmol/L</strong> : réduire ou suspendre les lipides / le propofol.");
  }
  if (m==="np") seuils.push("<strong>Dysfonction hépato-biliaire sévère</strong> : diminuer le débit de NP de 25 à 50 %, voire l'arrêter, et faire une imagerie (pathologie vésiculaire ou biliaire).");
  add("Préalbumine et albuminémie", "×1/semaine", "Efficacité du support nutritionnel", 4);
  const npLong = m==="np" && c.long;
  if (c.eerc) add("B1, B9, vitamine C, sélénium, cuivre, zinc (+ CRP)", "à J15, puis toutes les 2 semaines si l'EERc se prolonge", "EERc > 15 jours : pertes dans l'effluent (vitamine C : prélèvement à l'abri de la lumière)", 5);
  if (npLong) add("B1, B9, sélénium, cuivre, zinc (+ CRP, albumine)", "une fois, puis selon résultats", "Nutrition parentérale > 15 jours", 5);
  if (npLong) add("B12", "si anémie macrocytaire", "Réserves de plusieurs années : inutile en routine", 6);
  if (npLong) add("Manganèse (sang total)", "si NP > 30 jours avec atteinte hépatique", "Risque d'accumulation", 6);
  if (c.eerc) seuils.push("<strong>Cuivre bas ou EERc prolongée</strong> : ajouter du cuivre IV (l'ESPEN suggère environ 3 mg/j).");
  if (c.sri || c.sririsk){
    seuils.push("<strong>Phosphatémie &lt; 0,65 mmol/L</strong> : pas de majoration de la nutrition. <strong>Seulement si SRI avéré</strong> (autres critères diagnostiques présents, pas sur une hypophosphatémie isolée) : réduire à 500 kcal/j pendant 2 jours, puis +5 kcal/kg/j jusqu'à la cible.");
    seuils.push("<strong>Phosphatémie &lt; 0,4 mmol/L</strong> : suspendre la nutrition.");
  }
  items.sort((a,b)=>a.rank-b.rank);
  return { items, seuils };
}

  const section = (title) => `<div class="field-label" style="margin:18px 0 8px; color:var(--teal);">${title}</div>`;
  const row = (tt, s, badge, color) => `<div class="row-item"><div><div class="t">${tt}</div>${s?`<div class="s">${s}</div>`:''}</div>${badge?`<div class="badgeval" style="color:${color||'var(--teal)'}; background:${color==='var(--red)'?'var(--redDim)':color==='var(--amber)'?'var(--amberDim)':'var(--tealDim)'}; white-space:normal; max-width:45%; line-height:1.35;">${badge}</div>`:''}</div>`;
  const field = (id, label, val, unit, ph='') => `
      <label class="field"><span class="field-label">${label}</span>
        <div class="input-wrap"><input type="number" inputmode="decimal" id="${id}" value="${val}" placeholder="${ph}"><span class="unit">${unit}</span></div></label>`;
  const box = (title, color, dim, body) => `<div class="card" style="background:${dim}; border:1px solid ${color}; margin:12px 0 0;"><div class="field-label" style="color:${color}; margin-bottom:10px;">${title}</div>${body}</div>`;
  const line = (txt) => `<div style="font-size:13px; line-height:1.6; margin-bottom:6px;">— ${txt}</div>`;

  let body = '';
  if (sec === 'preop') body = renderDiabPreop({seg, section, row, field, box, line});
  else if (sec === 'postop') body = renderDiabPostop({seg, section, row, field, box, line});
  else if (sec === 'perop') body = renderDiabPerop({seg, section, row, field, box, line});
  else if (sec === 'sit') body = renderDiabSituations({seg, section, row, field, box, line});
  else body = renderDiabInsuline({seg, section, row, field, box, line});

  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.drop}</div>
      <div><h2>Patient diabétique</h2><p class="subtext">RFE SFAR 2025</p></div></div>
    ${seg('dbsec', sec, [{v:'preop',label:'Pré-op'},{v:'perop',label:'Per-op'},{v:'postop',label:'Post-op'},{v:'ins',label:'Insuline'},{v:'sit',label:'Situations'}]).replace('class="seg"','class="seg seg-sm"')}
    ${section('Type de diabète')}
    <div class="chips">${DB_TYPES.map(o=>`<button class="chip ${t===o.v?'active':''}" data-act="dbtype" data-val="${o.v}">${o.label}${o.s?` <span style="opacity:.7;">(${o.s})</span>`:''}</button>`).join('')}</div>
    ${t==='dt1' ? `<div class="warn-box" style="background:var(--redDim); color:var(--text);">${ICONS.alert}<span><strong>DT1 : ne jamais arrêter l'insuline basale</strong> (acidocétose en quelques heures). Même conduite après pancréatectomie totale (besoins souvent plus faibles : carence associée en glucagon).</span></div>` : ''}
  </div>
  ${body}`;
}

function egCalc(){
  const num = x => { const v = parseFloat(String(x).replace(',','.')); return isNaN(v) ? null : v; };
  const age = num(state.egAge), poids = num(state.poids), ap = num(state.egAP), cc = num(state.egCC);
  let csa = num(state.egCSA);
  if (csa==null && ap!=null && cc!=null) csa = Math.PI * ap * cc / 4; // cm²
  if (csa==null || age==null) return { csa };
  const vol = Math.max(0, 27 + 14.6*csa - 1.28*age);
  return { csa, vol, perkg: poids ? vol/poids : null };
}
function egDecision(){
  const c = state.egContenu, g = state.egGrade, calc = egCalc();
  if (!c) return null;
  if (c==='nc') return { t:'Examen non concluant', s:'Considérer l\'estomac comme plein : induction en séquence rapide (ou report si chirurgie programmée).', col:'var(--amber)' };
  if (c==='solide') return { t:'Estomac plein (solide ou liquide épais)', s:'Chirurgie programmée : reporter. Urgence : induction en séquence rapide.', col:'var(--red)' };
  if (c==='vide' || g==='0') return { t:'Estomac vide (grade 0)', s:'Risque d\'inhalation bas : induction habituelle.', col:'var(--teal)' };
  const pk = calc.perkg;
  if (pk!=null){
    return pk > 1.5 ? { t:`Liquide > 1,5 mL/kg (${pk.toFixed(1).replace('.',',')} mL/kg)`, s:'Estomac « plein » : séquence rapide ou report.', col:'var(--red)' }
                    : { t:`Liquide ≤ 1,5 mL/kg (${pk.toFixed(1).replace('.',',')} mL/kg)`, s:'Volume compatible avec un estomac à jeun : induction habituelle.', col:'var(--teal)' };
  }
  if (g==='1') return { t:'Liquide clair, grade 1', s:'Habituellement ≤ 1,5 mL/kg (volume de jeûne). Confirmer avec le calcul du volume.', col:'var(--teal)' };
  if (g==='2') return { t:'Liquide clair, grade 2', s:'Habituellement > 1,5 mL/kg : estomac « plein » probable. Calculer le volume.', col:'var(--amber)' };
  return { t:'Liquide clair', s:'Préciser le grade et calculer le volume.', col:'var(--amber)' };
}

/* ---------------- NAVIGATION ENTRE PARAGRAPHES ---------------- */
// go(libellé, {tab, sec, sub, id}) : lien interne qui ouvre l'onglet / la section et fait défiler jusqu'au paragraphe
function go(label, o){
  return `<a class="golink" data-act="goto" data-tab="${o.tab||''}" data-sec="${o.sec||''}" data-sub="${o.sub||''}" data-id="${o.id||''}">${label}&nbsp;›</a>`;
}
// Paragraphes dépliants : chaque carte de premier niveau se replie sous son titre.
// Ouverte par défaut si elle contient une saisie (champ, menu, puces) ; sinon repliée.
function enhanceCards(){
  if (!state.cardOpen) state.cardOpen = {};
  document.querySelectorAll('#content > .card').forEach(card=>{
    const title = card.querySelector(':scope > .section-title');
    if (!title || card.querySelector(':scope > .card-body')) return;
    const h2 = title.querySelector('h2');
    const key = state.tab + '|' + (h2 ? h2.textContent.trim() : '');
    const body = document.createElement('div'); body.className = 'card-body';
    while (title.nextSibling) body.appendChild(title.nextSibling);
    card.appendChild(body);
    const chev = document.createElement('span'); chev.className = 'card-chev'; chev.textContent = '▾'; title.appendChild(chev);
    const hasInput = !!body.querySelector('input:not([type=checkbox][readonly]), select, [data-act]:not([data-act="goto"])');
    const open = state.cardOpen[key] !== undefined ? state.cardOpen[key] : hasInput;
    if (!open) card.classList.add('collapsed');
    title.addEventListener('click', e=>{
      if (e.target.closest('a,button,input,select')) return;
      const nowOpen = card.classList.toggle('collapsed') === false;
      state.cardOpen[key] = nowOpen;
    });
    card.dataset.key = key;
  });
}
function openCardOf(el){
  const card = el.closest('#content > .card');
  if (card && card.classList.contains('collapsed')){ card.classList.remove('collapsed'); state.cardOpen[card.dataset.key] = true; }
}
function goTo(o){
  if (o.tab) state.tab = o.tab;
  if (o.sec) state.dbSec = o.sec;
  if (o.sub) state.dbInsSub = o.sub;
  if (o.id==='c-echo-tech') state.egOpenTech = true;
  render();
  requestAnimationFrame(()=>{
    const el = o.id ? document.getElementById(o.id) : document.getElementById('content');
    if (el && o.id) openCardOf(el);
    if (el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1400); }
  });
}

      <div class="grid grid-2" style="grid-template-columns:1fr 1fr;">
        ${field('f-nph-ne','Débit de la NE arrêtée',state.nphNeDebit,'mL/h')}
        <label class="field"><span class="field-label">Soluté</span><select id="f-nph-sol" style="width:100%; padding:10px 8px; border-radius:10px; border:1px solid var(--borderLight); background:var(--elevated); color:var(--text); font-size:13px;">${NE_GLUC.map((p,i)=>`<option value="${i}" ${String(state.nphSol)===String(i)?'selected':''}>${p[0]} (${String(p[1]).replace('.',',')} g/100 mL)</option>`).join('')}</select></label>
      </div>
      ${(() => { const d = parseFloat(String(state.nphNeDebit).replace(',','.')); if (isNaN(d) || d<=0) return ''; const g = d*NE_GLUC[state.nphSol||0][1]/100; return box('Relais glucosé', 'var(--amber)', 'var(--amberDim)', `<div class="grid grid-2" style="margin-bottom:8px;"><div class="stat"><div class="lbl">Glucides de la NE</div><div class="val">${String(Math.round(g*10)/10).replace('.',',')} g/h</div></div><div class="stat"><div class="lbl">G10 %</div><div class="val">${Math.round(g*10)} mL/h</div></div></div>`); })()}
      <div class="subtext" style="margin-top:6px; line-height:1.55;">Calcul : glucides apportés par la NE (g/h) = débit × teneur en glucides du soluté ; le G10 % contient 10 g de glucose pour 100 mL, donc G10 % (mL/h) = glucides (g/h) × 10. <strong>Règle de calcul proposée, non publiée</strong> : l'ADA demande seulement de démarrer « immédiatement » une perfusion de glucose, et le JBDS de « remplacer les glucides perdus », sans fixer de débit. À valider en équipe.</div>
      ${why("Sous NE continue, le besoin d'insuline est lié au glucose apporté en continu. La NPH, avec une action de 12–24 h et un pic, se fractionne toutes les 8 ou 12 h pour couvrir cet apport, et s'épuise plus vite qu'une lente si la NE s'arrête. Le relais à 80 % de l'IVSE (JBDS, essai de Schmeltz 2006) tient compte de la baisse des besoins une fois stabilisé. Revers : si la NE s'arrête, l'insuline déjà injectée continue d'agir, d'où le glucose IV immédiat.")}`;
  } else if (v==='cortico'){
    const clore = nphKg!=null && poids ? nphKg*poids : null;
    const tog = (k,l) => `<button class="chip ${state[k]?'active':''}" data-act="dbtoggle" data-val="${k}">${l}</button>`;
    let res = '';
    if (prof==='naif'){
      res = box('NPH du matin', 'var(--teal)', 'var(--tealDim)', `
        <div class="grid grid-2" style="margin-bottom:10px;">
          <div class="stat"><div class="lbl">Dose de départ</div><div class="val">10 UI</div><div class="sub">le matin, avec le corticoïde</div></div>
          <div class="stat"><div class="lbl">Titration</div><div class="val" style="font-size:18px;">+ 10–20 %/j</div><div class="sub">sur la glycémie de l'après-midi</div></div>
        </div>
        ${line('Schéma JBDS : dose basse, puis augmentation chaque jour jusqu\'à l\'objectif.')}
        ${clore!=null ? line(`Dose attendue selon le barème pondéral (Clore) : ≈ ${f(clore)} UI${nphKg>=0.4?' (plafond de 0,4 UI/kg)':''} ; la titration s'en rapproche en plusieurs jours (≈ 6 jours à + 20 %/j pour passer de 10 à 28 UI).`) : ''}`);
    } else if (prof==='ins'){
      res = clore!=null ? box('NPH du matin', 'var(--teal)', 'var(--tealDim)', `
        <div class="grid grid-2" style="margin-bottom:10px;">
          <div class="stat"><div class="lbl">Équivalent prednisone</div><div class="val">${f(pe)} mg</div></div>
          <div class="stat"><div class="lbl">NPH</div><div class="val">${reduce ? `${f(clore*0.75)}–${f(clore*0.8)}` : f(clore)} UI</div><div class="sub">${String(Math.round(nphKg*100)/100).replace('.',',')} UI/kg${nphKg>=0.4?' (plafond)':''}${reduce?' · réduite de 20–25 %':''}</div></div>
        </div>
        ${line('Barème de Clore : 0,1 UI/kg par 10 mg d\'équivalent prednisone, plafond 0,4 UI/kg, <strong>le matin avec le corticoïde</strong>.')}
        ${reduce ? line('Réduction de 20–25 % : <strong>proposition du service</strong> (non issue d\'une recommandation), en raison des facteurs cochés.') : ''}`) : `<div class="info-box">${ICONS.info}<span>Choisir le corticoïde, saisir la dose et le poids.</span></div>`;
    }
    content = `
      <div class="info-box" style="margin-top:0;">${ICONS.info}<span>Surtout pour le <strong>patient qui sort sous corticoïdes</strong> avec des glycémies restant déséquilibrées. En réanimation, la conduite habituelle (IVSE, basal-bolus) reste la règle.</span></div>
      <span class="field-label" style="margin-top:12px;">Corticoïde</span>
      <div class="chips">${Object.entries(EQ).map(([k,x])=>`<button class="chip ${state.nphCort===k?'active':''}" data-act="nphcort" data-val="${k}">${x[1]}</button>`).join('')}</div>
      <div class="grid grid-2" style="grid-template-columns:1fr 1fr; margin-top:10px;">
        ${field('f-nph-cort','Dose quotidienne',state.nphCortDose,'mg')}
        ${field('f-db-poids','Poids',state.poids,'kg')}
      </div>
      <span class="field-label" style="margin-top:12px;">Profil du patient</span>
      <div class="chips">
        <button class="chip ${prof==='naif'?'active':''}" data-act="nphprof" data-val="naif">Sans insuline, glycémies modérément élevées</button>
        <button class="chip ${prof==='ins'?'active':''}" data-act="nphprof" data-val="ins">Déjà sous insuline, ou hyperglycémie marquée</button>
      </div>
      ${prof==='ins' ? `<span class="field-label" style="margin-top:10px;">Réduire la dose si</span><div class="chips">${tog('nphAge','Sujet âgé')}${tog('nphIR','Insuffisance rénale')}${tog('nphApports','Apports alimentaires faibles')}${tog('nphDecr','Décroissance prévue dans les jours suivants')}</div>` : ''}
      ${res || (prof ? '' : `<div class="info-box">${ICONS.info}<span>Choisir le profil du patient.</span></div>`)}
      ${state.nphCort==='mp' ? line('<strong>Méthylprednisolone (Solumédrol)</strong>, corticothérapie anti-œdémateuse : si prise unique le matin, NPH le matin ; si prises multiples, NPH matin et soir ou lente.') : ''}
      ${state.nphCort==='dexa' ? line('<strong>Dexaméthasone</strong> (action 36–54 h) : préférer une lente, ou la NPH en 2 injections (matin et soir).') : ''}
      ${state.nphCort==='hc' ? line('<strong>Hydrocortisone</strong> en plusieurs prises ou continue : effet réparti sur 24 h, préférer une lente ou l\'IVSE.') : ''}
      ${row('Glycémies', 'Avant le déjeuner et le dîner (ou 2 h après le déjeuner) : le pic d\'hyperglycémie est l\'après-midi ; la glycémie à jeun le sous-estime. Cible 6–10 mmol/L (1,1–1,8 g/L), 6–12 acceptable (JBDS).')}
      ${row('Titration', '+ 10–20 %/j selon la glycémie de l\'après-midi (JBDS) ; −10–20 % si hypoglycémie (ADA). Patient déjà sous insuline : augmentation jusqu\'à 40 %.')}
      ${row('Décroissance du corticoïde', 'Baisser l\'insuline en parallèle, dans la même proportion, à chaque palier (ex. −5 mg de prednisolone à partir de 20 mg ≈ −20–25 % d\'insuline) ; surveillance renforcée 1 à 3 jours après chaque baisse. À l\'arrêt du corticoïde : arrêt de la NPH ; HbA1c à 12 semaines si diabète découvert sous corticoïdes.')}
      ${why("Un corticoïde donné le matin élève surtout la glycémie de l'après-midi et du soir, puis l'effet s'estompe la nuit : la NPH injectée en même temps a son pic 4–8 h plus tard et s'épuise la nuit. Deux stratégies : partir bas (10 UI) et monter chaque jour (JBDS), plus sûr chez le patient sans insuline ; ou viser d'emblée la dose attendue selon la dose de corticoïde (Clore : 0,1 UI/kg par 10 mg d'équivalent prednisone, plafond 0,4 UI/kg), chez le patient déjà sous insuline ou très hyperglycémique. Aux doses anti-œdémateuses (méthylprednisolone 1 mg/kg ≈ 87 mg d'équivalent prednisone pour 70 kg), le plafond est vite atteint. La dose doit baisser avec le corticoïde, sinon hypoglycémie.")}`;
  }
  return `
    <div class="chips" style="margin-bottom:12px;">
      <button class="chip ${v==='ne'?'active':''}" data-act="nphvolet" data-val="ne">NE continue</button>
      <button class="chip ${v==='cortico'?'active':''}" data-act="nphvolet" data-val="cortico">Corticoïdes (sortie)</button>
    </div>
    ${content || `<div class="info-box">${ICONS.info}<span>Choisir la situation.</span></div>`}
    <div class="subtext" style="margin-top:10px; line-height:1.6;">Sources : ADA Standards of Care 2025, section 16 (doi:10.2337/dc25-S016) ; JBDS 05 « Enteral feeding » (2024) et JBDS 08 « Steroid therapy » (2023) ; Schmeltz, Endocr Pract 2006 (doi:10.4158/EP.12.6.641) ; Clore et Thurby-Hay, Endocr Pract 2009 (doi:10.4158/EP08331.RAR) ; Cho et Suh, EnM 2024 (doi:10.3803/EnM.2024.1951).</div>`;
}

function renderDiabPerop(h){
  const {section, row, box, line} = h;
  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.activity}</div>
      <div><h2>Au bloc opératoire</h2><p class="subtext">RFE SFAR 2025 · mise au point Cheisson 2025</p></div></div>
    ${row('Objectif glycémique', '<strong>5–10 mmol/L (0,9–1,8 g/L)</strong>.')}
    ${row('Mesure', 'Sang total artériel ou veineux, si possible sur gaz du sang ; préférer les glycémies artérielles, veineuses ou capillaires au glucose interstitiel (capteur) en peropératoire.')}
    ${row('Insuline IVSE', 'Selon le protocole : DT1, pompe arrêtée, ou glycémie &gt; 1,8 g/L (chez le DT2 à glycémie normale : débit 0, surveillance). ' + go('Protocole IVSE', {tab:'diab', sec:'ins', sub:'ivse', id:'c-insuline'}))}
    ${row('Apport glucosé', 'G10 % 40 mL/h au bloc sous IVSE, sauf glycémie &gt; 16,5 mmol/L (3 g/L).')}
    ${row('Kaliémie', 'Objectif 4–4,5 mmol/L ; contrôle toutes les 4 h si stable, sinon à chaque changement de débit d\'insuline.')}
    ${row('Pompe maintenue', 'Seulement si tous les critères sont réunis ; sinon arrêt et IVSE. ' + go('critères de maintien', {tab:'diab', sec:'preop', id:'c-pompe'}))}
    ${row('Hémodynamique', 'Dysautonomie : instabilité à l\'induction, hypotension orthostatique ; monitorage adapté. Néphropathie : éviter les néphrotoxiques, maintenir la pression de perfusion rénale.')}
    ${row('NVPO', 'Bithérapie : dexaméthasone 4 mg + dropéridol ou sétron (la dexaméthasone élève modérément la glycémie : surveiller) ; favoriser une reprise alimentaire rapide.')}
    ${row('Sortie de SSPI', 'Arrêt de l\'IVSE et relais SC (ou pompe) à la sortie de SSPI ou de soins critiques, sans délai pour la lente. ' + go('Relais IVSE → SC', {tab:'diab', sec:'ins', sub:'relais', id:'c-insuline'}))}
    ${why("Au bloc, le jeûne, le stress chirurgical et l'anesthésie rendent la glycémie imprévisible : l'IVSE, à courte durée d'action, s'ajuste d'heure en heure. Le glucose associé évite l'hypoglycémie sous insuline. L'insuline fait entrer le potassium dans les cellules, d'où la surveillance de la kaliémie.")}
  </div>
  ${renderEchoGastrique(h)}`;
}

function renderDiabPreop(h){
  const {seg, section, row, field, box, line} = h;
  const c = state.dbChir;
  const hb = parseFloat(String(state.dbHba1c).replace(',','.'));
  const sel = DB_TTT.filter(x=>state.dbTtt[x[0]]);
  const col = c==='amb' ? 3 : c==='maj' ? 4 : c==='urg' ? 5 : null;
  const grp = (a,b) => `<div class="grp"><span class="g1">${a}</span><span class="g2">${b}</span></div>`;
  const hbC = isNaN(hb) ? null : hb < 5 ? ['Différer','HbA1c < 5 %','var(--red)','var(--redDim)'] : hb < 6 ? ['Avis médecin généraliste / diabétologue','HbA1c 5–6 %','var(--amber)','var(--amberDim)'] : hb <= 8 ? ['Intervention possible','HbA1c 6–8 %','var(--teal)','var(--tealDim)'] : hb <= 9 ? ['Avis médecin généraliste / diabétologue','HbA1c 8–9 %','var(--amber)','var(--amberDim)'] : ['Différer la chirurgie programmée','HbA1c > 9 %','var(--red)','var(--redDim)'];
  return `
  ${grp('CPA','Consultation pré-anesthésique')}
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.clip}</div>
      <div><h2>Évaluation préopératoire</h2><p class="subtext">Consultation d'anesthésie</p></div></div>
    ${section('Stratégie préopératoire')}
    <div class="grid grid-2" style="grid-template-columns:1fr 1fr;">
      ${field('f-db-hba1c','HbA1c',state.dbHba1c,'%')}
      <div></div>
    </div>
    ${hbC ? `<div class="row-item" style="border:1px solid ${hbC[2]}; background:${hbC[3]}; margin-top:12px;"><div><div class="t" style="color:${hbC[2]};">${hbC[0]}</div><div class="s">${hbC[1]} · stratégie préopératoire RFE SFAR 2025</div></div></div>` : ''}
    ${hbC ? why("L'HbA1c reflète la glycémie des 3 derniers mois. Élevée : l'hyperglycémie chronique augmente les infections du site opératoire et les complications, et l'équilibrer avant une chirurgie programmée réduit ce risque. Très basse chez un diabétique traité : faire rechercher des hypoglycémies répétées (qui se majorent avec le jeûne) ou une HbA1c faussement basse (anémie, hémolyse, transfusion récente).") : ''}
    <div class="subtext" style="margin-top:6px;">HbA1c : récupérer le dernier dosage, ou doser si aucun depuis plus de 3 mois ou si le diabète est déséquilibré. &lt; 5 % ou &gt; 9 % : différer ; 5–6 % ou 8–9 % : avis du médecin généraliste ou du diabétologue ; 6–8 % : intervention possible.</div>

    ${section('Diabète en CPA')}
    ${row('Gastroparésie', '± cimétidine 400 mg avant l\'induction ; échographie gastrique ; ± induction en séquence rapide (crush).')}
    ${row('Dysautonomie', 'Hypotension orthostatique : ± monitorage hémodynamique, SIPO.')}
    ${row('Micro- et macroangiopathie', 'Rétinopathie, néphropathie, neuropathie ; AOMI, coronaropathie (ischémie silencieuse), AVC.')}
    ${row('Signe du prieur', 'Facteur de risque d\'intubation difficile.')}
    ${row('Bilan minimum', 'HbA1c &lt; 3 mois, bilan électrolytique (créatinine), ECG de repos.')}
  </div>

  <div class="card" id="c-treat">
    <div class="section-title"><div class="icon-box">${ICONS.pill}</div>
      <div><h2>Gestion des traitements</h2><p class="subtext">Choisir la chirurgie et cocher les traitements du patient</p></div></div>
    <div class="chips">${DB_CHIR.map(o=>`<button class="chip ${c===o.v?'active':''}" data-act="dbchir" data-val="${o.v}">${o.label}${o.s?` <span style="opacity:.7;">(${o.s})</span>`:''}</button>`).join('')}</div>
    ${section('Traitements')}
    ${DB_TTT.map(x=>`
      <div class="checkrow ${state.dbTtt[x[0]]?'checked':''}" data-act="dbttt" data-val="${x[0]}">
        <input type="checkbox" ${state.dbTtt[x[0]]?'checked':''} readonly>
        <div><div class="t">${x[1]}</div>${x[2]?`<div class="s">${x[2]}</div>`:''}</div>
      </div>`).join('')}
    ${col && sel.length ? box('Conduite à tenir', 'var(--teal)', 'var(--tealDim)', sel.map(x=>{
        let v = x[col];
        const red = /Arrêt/.test(v) && x[0]==='sglt2';
        return row(x[1], '', v, red ? 'var(--red)' : undefined);
      }).join('')) : `<div class="info-box">${ICONS.info}<span>Choisir le type de chirurgie et cocher au moins un traitement.</span></div>`}
    ${col && sel.length ? why(sel.map(x=>({
        metf:"<strong>Metformine</strong> : inutile sans repas, et risque d'acidose lactique si hypoperfusion ou insuffisance rénale aiguë périopératoire.",
        su:"<strong>Sulfamides, glinides</strong> : stimulent la sécrétion d'insuline même à jeun, donc hypoglycémie si le patient ne mange pas.",
        dpp4:"<strong>Gliptines, acarbose</strong> : agissent sur la glycémie des repas, sans intérêt à jeun.",
        glp1:"<strong>Agonistes du GLP-1</strong> : action prolongée (l'arrêt la veille ne change rien) et bénéfice glycémique ; le risque est l'estomac plein, qu'on recherche à l'échographie.",
        sglt2:"<strong>iSGLT2</strong> : la perte urinaire de glucose et la cétogenèse persistent plusieurs jours ; avec le jeûne et le stress chirurgical, risque d'acidocétose à glycémie normale.",
        ins:"<strong>Insulines</strong> : rapides et mélanges sans repas = hypoglycémie ; la basale du DT1 ne s'arrête jamais (acidocétose en quelques heures sans insuline).",
        pompe:"<strong>Pompe</strong> : au bloc, difficile à surveiller et à ajuster (champ, position, déconnexion) ; l'IVSE est plus maniable."
      })[x[0]]).join(' ') + (col===5 ? ' <strong>Urgence</strong> : apports et fonction rénale imprévisibles, donc arrêt des antidiabétiques oraux et relais par insuline.' : '')) : ''}
    ${state.dbTtt.metf ? `<div class="warn-box" style="background:var(--amberDim); color:var(--text);">${ICONS.alert}<span><strong>Metformine et produit de contraste iodé</strong> (CIRTACI/SFR 2020, ESUR 2018) : <strong>poursuivre</strong> si DFG ≥ 30 mL/min/1,73 m² et pas d'IRA, en IV ou en intra-artériel de 2<sup>e</sup> passage (carotides, vertébrales : angiographie cérébrale, thrombectomie). <strong>Arrêter le jour de l'examen, pendant 48 h</strong> si DFG &lt; 30, IRA, ou injection intra-artérielle de 1<sup>er</sup> passage (cœur gauche, coronarographie, aorte sus-rénale, artères rénales) ; <strong>reprise à 48 h</strong> si le DFG contrôlé n'a pas changé significativement. Le RCP reste plus restrictif (arrêt systématique).</span></div>` : ''}
    ${state.dbTtt.sglt2 ? `<div class="warn-box" style="background:var(--redDim); color:var(--text);">${ICONS.alert}<span><strong>iSGLT2 : acidocétose euglycémique.</strong> Si la dernière prise date de moins de 3 jours (urgence) : cétonémie (plutôt que cétonurie) et algorithme dédié (${go('paragraphe iSGLT2', {tab:'diab', sec:'sit', id:'c-sglt2'})}). Reprise après vérification de la fonction rénale et reprise alimentaire.</span></div>` : ''}
    ${state.dbTtt.glp1 ? `<div class="warn-box" style="background:var(--amberDim); color:var(--text);">${ICONS.alert}<span><strong>Agonistes du GLP-1 : poursuivis</strong>, y compris le matin d'une intervention majeure. Vidange gastrique ralentie (surtout en phase d'augmentation de dose ou si symptômes digestifs) : <strong>échographie gastrique</strong> (${go('voir le paragraphe', {tab:'diab', sec:'perop', id:'c-echo'})}) ; si doute, induction en séquence rapide.</span></div>` : ''}
    ${state.dbTtt.pompe ? `<div class="info-box">${ICONS.info}<span><strong>Pompe</strong> : maintien possible sous conditions, sinon arrêt au bloc et IVSE : ${go('critères de maintien', {tab:'diab', sec:'preop', id:'c-pompe'})}.</span></div>` : ''}
  </div>

  <div class="card" id="c-pompe">
    <div class="section-title"><div class="icon-box">${ICONS.syringe}</div>
      <div><h2>Pompe à insuline : maintien ou arrêt</h2><p class="subtext">RFE SFAR 2025</p></div></div>
    <div class="warn-box" style="background:var(--amberDim); color:var(--text); margin:0 0 14px;">${ICONS.alert}<span><strong>En CPA : noter dans le dossier les réglages de la pompe</strong> (débits basaux par tranche horaire, bolus habituels et <strong>schéma de secours</strong> : l'insuline en stylos, lente et rapide, que le patient utilise si sa pompe est arrêtée ou en panne, prévue par son diabétologue), indispensables pour le relais IVSE et la reprise de la pompe.</span></div>
    <div class="field-label" style="margin-bottom:8px; color:var(--teal);">Maintien possible si tous les critères sont réunis</div>
    ${['Intervention courte (&lt; 2 h)','Pas de perturbation attendue du contrôle glycémique','Dispositifs visibles et à distance du champ opératoire','Glycémies artérielles, veineuses ou capillaires en peropératoire (plutôt que le glucose interstitiel)','Accord du patient et de l\'équipe d\'anesthésie','Gestion de son matériel par le patient dès le post-opératoire','Avis du diabétologue pour adapter les débits'].map(t=>`<div class="checkrow"><input type="checkbox" readonly><div><div class="t" style="font-size:13px;">${t}</div></div></div>`).join('')}
    ${row('Sinon', 'Arrêt de la pompe à l\'arrivée au bloc et relais par IVSE ; reprise de la pompe en SSPI.')}
    ${row('Chirurgie courte (≤ 1 repas jeûné)', 'Pas d\'arrêt.')}
    ${row('Urgence', 'Arrêt et relais IVSE.')}
    ${why("La pompe ne délivre que de l'insuline rapide : si elle s'arrête ou se déconnecte sans relais, le patient n'a plus aucune insuline basale et peut faire une acidocétose en quelques heures (surtout DT1). Au bloc, elle est difficile à surveiller ; on ne la garde que si l'intervention est courte et que le patient (ou l'équipe) peut la gérer.")}
  </div>

  ${grp('VPA','Visite pré-anesthésique, dans les 48 h avant l\'intervention')}
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.clip}</div>
      <div><h2>À vérifier en VPA</h2><p class="subtext">Diabétique opéré</p></div></div>
    <div class="checkrow"><input type="checkbox" readonly><div><div class="t">HbA1c disponible</div><div class="s">Datant de moins de 3 mois (sinon doser) ; décision déjà prise en CPA.</div></div></div>
    <div class="checkrow"><input type="checkbox" readonly><div><div class="t">iSGLT2 : dernière prise ≥ 3 jours</div><div class="s">Sinon cétonémie et ${go('algorithme iSGLT2', {tab:'diab', sec:'sit', id:'c-sglt2'})}</div></div></div>
    <div class="checkrow"><input type="checkbox" readonly><div><div class="t">Consignes de la veille et du matin</div><div class="s">Selon le type de chirurgie et le traitement : ${go('gestion des traitements', {tab:'diab', sec:'preop', id:'c-treat'})}</div></div></div>
    <div class="checkrow"><input type="checkbox" readonly><div><div class="t">Glycémies de la veille et de la nuit</div><div class="s">Conduite selon le tableau ci-dessous ; ≥ 3 g/L le matin : IVSE en réa et bloc différé.</div></div></div>
    <div class="checkrow"><input type="checkbox" readonly><div><div class="t">Agoniste du GLP-1 ou gastroparésie</div><div class="s">Prévoir l'${go('échographie gastrique', {tab:'diab', sec:'perop', id:'c-echo'})} avant l'induction.</div></div></div>

    ${row('Le matin', 'Pas de prise des antidiabétiques non insuliniques (sauf chirurgie courte).')}

    <div style="overflow-x:auto; margin-top:8px;"><table>
      <thead><tr><th>Glycémie</th><th>Veille et nuit</th><th>Matin avant le bloc</th></tr></thead>
      <tbody>
        <tr><td class="strong">&lt; 5 mmol/L (0,9 g/L)</td><td>15 g de sucre PO, contrôle à 15 min, prévenir le médecin</td><td>G10 % 60 mL/h, prévenir le médecin</td></tr>
        <tr><td class="strong">5–10 (0,9–1,8)</td><td>Rien</td><td>Rien</td></tr>
        <tr><td class="strong">10–12 (1,8–2,2)</td><td>3 UI SC d'analogue rapide</td><td>3 UI SC</td></tr>
        <tr><td class="strong">12–16,5 (2,2–3)</td><td>4 UI SC</td><td>4 UI SC</td></tr>
        <tr><td class="strong">≥ 16,5 (≥ 3)</td><td>6 UI SC + recherche de cétose, prévenir le médecin (ou IVSE en réa la nuit)</td><td style="color:var(--red);">6–7 h : VVP NaCl 0,9 %. Avant le bloc : IVSE en réa, différer le bloc</td></tr>
      </tbody></table></div>
    <div class="info-box">${ICONS.info}<span>Objectif périopératoire : <strong>5–10 mmol/L (0,9–1,8 g/L)</strong>.</span></div>
  </div>`;
}

  return `
  <div class="card" id="c-ado">
    <div class="section-title"><div class="icon-box">${ICONS.pill}</div>

  </div>`;
}

function renderDiabPostop(h){
  const {seg, section, row, field, box, line} = h;
  const m = state.dbPostMode;
  const insulinPrev = state.dbType==='dt1' || state.dbType==='dt2i';
  const clcr = parseFloat(state.dbClcr);
  const bas = parseFloat(state.dbBasale);
  // Algorithme de reprise DT2
  let rep = null;
  if (state.dbType==='dt2' || state.dbType==='dt2i'){
    if (!state.dbRepAlim) rep = { t:'Continuer et adapter le basal-bolus', s:'Alimentation orale insuffisante.', c:'var(--amber)' };
    else if (!state.dbRep12) rep = { t:'Continuer et adapter le basal-bolus', s:'Glycémies pas encore < 12 mmol/L (2,2 g/L) depuis plus de 24 h.', c:'var(--amber)' };
    else {
      const ad = isNaN(clcr) ? 'Renseigner la clairance de la créatinine.' : clcr > 60 ? 'Reprise de tous les antidiabétiques non insuliniques.' : clcr >= 30 ? 'Reprise des antidiabétiques non insuliniques <strong>sauf metformine</strong>.' : '<strong>Pas de reprise</strong> des antidiabétiques non insuliniques.';
      let ins;
      if (state.dbType==='dt2i') ins = 'Reprise des insulines antérieures (adaptées). Retour à domicile avec compte rendu au médecin traitant.';
      else if (isNaN(bas)) ins = 'Renseigner la dose d\'insuline lente actuelle.';
      else if (bas >= 16) ins = '<strong>Insuline lente ≥ 16 UI/j</strong> : continuer le basal-bolus et appeler l\'équipe d\'endocrinologie avant la sortie.';
      else ins = 'Insuline lente &lt; 16 UI/j : arrêter le basal-bolus. Retour à domicile avec compte rendu au médecin traitant.';
      rep = { t:'Reprise possible', s:`${ad}<br>${ins}`, c:'var(--teal)' };
    }
  }
  const modes = [{v:'ne',label:'NE continue'},{v:'np',label:'NP'},{v:'po',label:'Orale'},{v:'jeun',label:'À jeun'}];
  const insByMode = {
    ne: 'Pas de bolus « repas ». Instable ou glycémies hors cible répétées : IVSE. Stabilisé : insuline lente + bolus correcteurs toutes les 4 h.',
    np: 'Pas de bolus « repas ». IVSE en réanimation si glycémies hors cible ; stabilisé : insuline lente + bolus correcteurs.',
    po: 'Basal-bolus : insuline lente + bolus avant chaque repas (0,1 UI/kg ; moitié si les apports sont insuffisants) + bolus correcteurs.',
    jeun: 'Insuline lente maintenue (jamais d\'arrêt chez le DT1) + bolus correcteurs. Apport glucosé indispensable.'
  };
  return `
  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.activity}</div>
      <div><h2>Cibles et insuline selon la nutrition</h2><p class="subtext">Post-opératoire et réanimation</p></div></div>
    <div class="grid grid-2">
      <div class="stat" style="background:var(--tealDim); border:1px solid var(--teal);"><div class="lbl" style="color:var(--teal);">Cible en réanimation</div><div class="val" style="color:var(--teal); font-size:20px;">1,2–1,8 g/L</div><div class="sub">6,7–10 mmol/L</div></div>
      <div class="stat"><div class="lbl">Bloc / SSPI (RFE SFAR 2025)</div><div class="val" style="font-size:20px;">0,9–1,8 g/L</div><div class="sub">5–10 mmol/L</div></div>
    </div>
    <div class="subtext" style="margin-top:6px;">Hypoglycémie : &lt; 0,6 g/L (3,3 mmol/L). Hyperglycémie &gt; 1,8 g/L associée à une surmorbidité.</div>
    ${section('Mode de nutrition')}
    ${seg('dbpost', m, modes)}
    ${m ? box('Insuline', 'var(--teal)', 'var(--tealDim)', `<div style="font-size:13px; line-height:1.6;">${insByMode[m]}</div>`) : ''}
    ${m ? why(({ne:"La NE continue apporte du glucose en permanence : il n'y a pas de pic de repas à couvrir. La basale et les corrections suffisent ; l'IVSE s'impose si les besoins varient beaucoup (instabilité, corticoïdes, sepsis).",
      np:"La NP apporte du glucose en continu, souvent en grande quantité : même raisonnement que la NE continue, avec IVSE si les glycémies restent hors cible.",
      po:"Les repas créent des pics de glycémie : le bolus avant le repas les couvre, la basale couvre le reste de la journée.",
      jeun:"Même à jeun, l'organisme a besoin d'insuline basale (production hépatique de glucose) ; sans glucose apporté, cette basale expose à l'hypoglycémie."})[m]) : ''}
    ${m==='ne' || m==='np' ? `<div class="warn-box" style="background:var(--amberDim); color:var(--text);">${ICONS.alert}<span><strong>Arrêt imprévu de la ${m==='ne'?'NE':'NP'} sous insuline</strong> (transport, bloc, intolérance) : risque d'hypoglycémie. Apport glucosé de relais (G10 % 40 mL/h) et contrôle glycémique ; IVSE : reprendre l'algorithme.</span></div>` : ''}
    ${m==='jeun' ? `<div class="info-box">${ICONS.info}<span>Jeûne prolongé : 100 à 150 g de glucose par jour (par exemple G10 % 40 mL/h ≈ 100 g/j).</span></div>` : ''}
  </div>

  <div class="card">
    <div class="section-title"><div class="icon-box">${ICONS.flask}</div>
      <div><h2>Solutés</h2><p class="subtext">Apports glucidiques</p></div></div>
    ${row('Nutrition entérale', 'Formule standard hyperprotéinée adaptée à la phase (' + go('onglet Solutés', {tab:'solutes'}) + '). Aucune recommandation ne justifie une formule « diabète » en réanimation : l\'équilibre glycémique repose sur l\'insuline.')}

    ${row('HbA1c', 'À l\'admission si non connue, et chez tout patient hyperglycémique non connu diabétique.', '1 fois')}
