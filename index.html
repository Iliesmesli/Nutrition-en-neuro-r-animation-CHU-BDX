    <div class="chips">
      <button class="chip ${state.dbRepAlim?'active':''}" data-act="dbtoggle" data-val="dbRepAlim">Alimentation orale suffisante</button>
      <button class="chip ${state.dbRep12?'active':''}" data-act="dbtoggle" data-val="dbRep12">Glycémie &lt; 12 mmol/L (2,2 g/L) depuis &gt; 24 h</button>
    </div>
    <div class="grid grid-2" style="grid-template-columns:1fr 1fr; margin-top:12px;">
      ${field('f-db-clcr','Clairance créatinine',state.dbClcr,'mL/min')}
      ${state.dbType==='dt2' ? field('f-db-basale','Lente SC du basal-bolus',state.dbBasale,'UI/j') : '<div></div>'}
    </div>
    ${rep ? `<div class="row-item" style="border:1px solid ${rep.c}; margin-top:12px;"><div><div class="t" style="color:${rep.c};">${rep.t}</div><div class="s" style="font-size:13px; color:var(--text);">${rep.s}</div></div></div>` : ''}
    ${rep ? why("On ne reprend les comprimés que si le patient mange suffisamment (sinon hypoglycémies sous sulfamides ou glinides), si la glycémie est stable (sinon ils seront insuffisants) et selon la fonction rénale (élimination des médicaments). Plus de 16 UI/j de lente chez un patient qui n'était pas sous insuline signe un besoin insulinique durable : avis endocrinologique.") : ''}
    <div class="subtext" style="margin-top:6px;">Le seuil de 16 UI/j porte sur la dose d'<strong>insuline lente SC</strong> du basal-bolus (RFE SFAR 2025), pas sur le débit d'IVSE : les seuils d'IVSE (≤ 4 UI/h ; ≤ 0,5 UI/h chez le non-insulinotraité) servent au relais IVSE → SC, étape précédente (${go('Relais IVSE → SC', {tab:'diab', sec:'ins', sub:'relais', id:'c-insuline'})}). iSGLT2 et agonistes du GLP-1 : reprise une fois l'équilibre glycémique et l'alimentation retrouvés. Diabète découvert pendant le séjour : avis diabétologique avant la sortie.</div>`}
    ${(() => {
      const k = isNaN(clcr) ? null : clcr > 60 ? 0 : clcr >= 30 ? 1 : 2;
      // [classe, statut >60, 30–60, <30, pourquoi]
      const R = [
        ['Metformine', 'Oui', 'Non', 'Non', 'Élimination rénale exclusive : accumulation → <strong>acidose lactique</strong>, favorisée en post-opératoire par l\'hypoperfusion, l\'hypoxie, le sepsis et les produits de contraste. Contre-indiquée si DFG &lt; 30 ; la RFE SFAR 2025 ne la reprend pas dès 30–60 (fonction rénale encore instable).'],
        ['Sulfamides', 'Oui', 'Oui (prudence)', 'Non', 'Métabolites actifs éliminés par le rein → <strong>hypoglycémies sévères et prolongées</strong>, d\'autant plus que les apports restent irréguliers. Contre-indiqués en insuffisance rénale sévère ; glibenclamide : pharmacocinétique modifiée dès l\'IR modérée.'],
        ['Glinides', 'Oui', 'Oui', 'Non', 'Élimination surtout hépatique, mais risque d\'hypoglycémie si les repas sont irréguliers ; la RFE SFAR 2025 arrête tous les AD si DFG &lt; 30.'],
        ['Gliptines', 'Oui', 'Oui, dose adaptée', 'Non', 'Élimination rénale (sauf linagliptine) : dose à réduire ; la RFE SFAR 2025 privilégie l\'insuline si DFG &lt; 30 (reprise possible à dose réduite sur avis).'],
        ['Gliflozines', 'Oui', 'Oui (effet ↓ si &lt; 45)', 'Non', 'Effet glycémique réduit si DFG &lt; 45, nul si très bas ; initiation non recommandée si DFG &lt; 25 (dapagliflozine) ou &lt; 20 (empagliflozine) ; <strong>acidocétose euglycémique</strong> si reprise avant une alimentation suffisante ; déplétion volémique et baisse du DFG.'],
        ['Agonistes du GLP-1', 'Oui', 'Oui', 'Non', 'Nausées, vomissements, iléus → déshydratation et IRA. IR terminale : liraglutide et dulaglutide non recommandés, sémaglutide et tirzépatide avec prudence.']
      ];
      const col = st => /^Non/.test(st) ? 'var(--red)' : /prudence|adapt|effet/.test(st) ? 'var(--amber)' : 'var(--teal)';
      return `<details style="margin-top:12px;" ${k!=null?'open':''}><summary class="row-item" style="cursor:pointer; list-style:none;"><div><div class="t">Pourquoi (ne pas) reprendre chaque antidiabétique ?</div><div class="s">${k==null ? 'Renseigner la clairance pour voir la conduite par classe' : 'Clairance ' + (k===0 ? '&gt; 60' : k===1 ? '30–60' : '&lt; 30') + ' mL/min · une fois les conditions de reprise réunies'}</div></div></summary>
        ${R.map(r=>{ const st = k==null ? '' : r[1+k]; return `<div class="row-item" style="display:block;"><div style="display:flex; justify-content:space-between; gap:10px; align-items:center;"><div class="t">${r[0]}</div>${st?`<div class="badgeval" style="color:${col(st)}; background:var(--elevated2);">${st}</div>`:''}</div><div class="s" style="font-size:12px; line-height:1.5; margin-top:4px; color:var(--textMuted);">${r[4]}</div></div>`; }).join('')}
        <div class="subtext" style="margin-top:6px;">Conditions communes (RFE SFAR 2025) : alimentation orale suffisante et glycémies &lt; 12 mmol/L (2,2 g/L) depuis plus de 24 h. Clairance idéalement mesurée. Tant que ces conditions ne sont pas remplies, le basal-bolus assure l'équilibre.</div>
      </details>`;
    })()}
  </div>
  ${renderAdo(h)}`;
}

function renderDiabInsuline(h){
  const {seg, section, row, field, box, line} = h;
  const sub = state.dbInsSub;
  const v = dbGlyVal();
  const b = dbBin(v);
  const t = state.dbType;
  const u = state.dbUnit==='mmol' ? 'mmol/L' : 'g/L';
  const poids = parseFloat(state.poids) || 0;
  const r1 = x => Math.round(x*10)/10;
  const fmt = x => String(r1(x)).replace('.',',');
  const glyInput = `
    <div class="grid grid-2" style="grid-template-columns:1fr 1fr; align-items:end;">
      ${field('f-db-gly','Glycémie',state.dbGly,u)}
      <div class="field"><span class="field-label">Unité</span>${seg('dbunit', state.dbUnit, [{v:'gl',label:'g/L'},{v:'mmol',label:'mmol/L'}])}</div>
    </div>
    ${b!=null && sub==='ivse' ? `<div class="subtext" style="margin-top:6px;">Classe : ${DB_BIN_LABEL[b]}</div>` : ''}`;
  const subs = [{v:'ivse',label:'IVSE'},{v:'sc',label:'SC basal-bolus'},{v:'relais',label:'Relais IVSE → SC'},{v:'nph',label:'NPH'}];
  let content = '';

  if (sub === 'ivse'){
    const on = state.dbIvseOn;
    const d = parseFloat(String(state.dbDebit).replace(',','.'));
    let res = '';
    if (b==null) res = `<div class="info-box">${ICONS.info}<span>Saisir la glycémie.</span></div>`;
    else if (!on){
      const r = DB_IVSE_INIT[b];
      const deb = t==='dt1' ? r.d1 : r.d2;
      const needType = (b===3 || b===4) && !t;
      res = box('Initiation de l\'IVSE', b<=1 ? 'var(--red)' : 'var(--teal)', b<=1 ? 'var(--redDim)' : 'var(--tealDim)', `
        <div class="grid grid-3" style="margin-bottom:10px;">
          <div class="stat"><div class="lbl">Bolus IVD</div><div class="val">${r.bolus} UI</div></div>
          <div class="stat"><div class="lbl">Débit</div><div class="val">${needType ? '?' : deb} UI/h</div>${(b===3||b===4)?`<div class="sub">DT1 : 1 · DT2 : 0</div>`:''}</div>
          <div class="stat"><div class="lbl">Contrôle</div><div class="val" style="font-size:18px;">${r.ctl}</div></div>
        </div>
        ${r.g30 ? line(`<strong>G30 % : ${r.g30}</strong>`) : ''}
        ${r.med ? line('<strong>Prévenir le médecin</strong> ; rechercher une cétose ; pas d\'apport glucosé systématique.') : ''}
        ${needType ? line('Préciser le type de diabète.') : ''}`);
    } else {
      const r = DB_IVSE_ADAPT[b];
      let nd = '', txt = '';
      if (r.stop){ nd = 'Arrêt'; txt = `Reprise à <strong>½ débit</strong> quand la glycémie dépasse ${t==='dt1' ? '5,5 mmol/L (1 g/L) chez le DT1' : t ? '10 mmol/L (1,8 g/L) chez le DT2' : '5,5 mmol/L (DT1) ou 10 mmol/L (DT2)'}${!isNaN(d) ? ` : ${fmt(d/2)} UI/h` : ''}.`; }
      else if (r.bolus6){ nd = !isNaN(d) ? `${fmt(d)} UI/h` : 'inchangé'; txt = '<strong>Bolus de 6 UI IVD et prévenir le médecin</strong> ; rechercher une cétose.'; }
      else if (r.delta===0){ nd = !isNaN(d) ? `${fmt(d)} UI/h` : 'Idem'; txt = 'Pas de modification.'; }
      else { nd = !isNaN(d) ? `${fmt(Math.max(0, d + r.delta))} UI/h` : `${r.delta>0?'+':''}${r.delta} UI/h`; txt = `${r.delta>0?'+':''}${r.delta} UI/h${!isNaN(d) && d + r.delta <= 0 ? ' → débit nul' : ''}.`; }
      res = box('Adaptation du débit', b<=1 ? 'var(--red)' : 'var(--teal)', b<=1 ? 'var(--redDim)' : 'var(--tealDim)', `
        <div class="grid grid-2" style="margin-bottom:10px;">
          <div class="stat"><div class="lbl">Nouveau débit</div><div class="val">${nd}</div></div>
          <div class="stat"><div class="lbl">Contrôle</div><div class="val" style="font-size:18px;">${r.ctl}</div></div>
        </div>
        ${line(txt)}
        ${r.g30 ? line(`<strong>G30 % : ${r.g30}</strong>`) : ''}
        ${!isNaN(d) && d > 4 ? line('<strong>Débit &gt; 4 UI/h</strong> : pas de relais SC possible.') : ''}`);
    }
    if (b!=null) res += why(on
      ? "Le débit s'ajuste à l'écart à la cible : on augmente d'autant plus que la glycémie est haute. En hypoglycémie, on arrête et on resucre, puis on reprend à la moitié du débit, puisque le besoin était surestimé. Le DT1 reprend plus tôt (dès 5,5 mmol/L) car il ne peut pas rester sans insuline. Contrôles rapprochés quand la glycémie est basse ou que le débit change."
      : "Le débit de départ est proportionnel à la glycémie, avec un bolus au-delà de 1,8 g/L pour corriger plus vite. Chez le DT1, 1 UI/h même en zone normale : sans insuline de base, il fait une acidocétose. Chez le DT2 en zone normale, on attend et on contrôle.");
    content = `
      ${glyInput}
      ${section('Situation')}
      ${seg('dbivseon', on ? 'on' : 'off', [{v:'off',label:'Initiation'},{v:'on',label:'IVSE en cours'}])}
      ${on ? `<div style="margin-top:12px;">${field('f-db-debit','Débit actuel',state.dbDebit,'UI/h')}</div>` : ''}
      ${res}
      ${section('Modalités')}
      ${row('Préparation', 'Analogue rapide 1 UI/mL dans NaCl 0,9 % ; robinet proximal sur KTC ou VVP.')}
      ${row('Où', 'Unités de soins critiques ou bloc seulement. <strong>Jamais en hospitalisation conventionnelle.</strong>')}
      ${row('Apport glucosé', 'Au bloc : G10 % 40 mL/h systématique, sauf glycémie &gt; 16,5 mmol/L (3 g/L). En réanimation, la nutrition apporte le glucose : si elle est interrompue, G10 % 40 mL/h.')}
      ${row('Kaliémie', 'Objectif 4–4,5 mmol/L.', '/4 h si stable, sinon à chaque changement de débit')}
      ${row('Arrêt et relais SC', 'Dès que les glycémies sont stabilisées et ≤ 10 mmol/L (1,8 g/L), si alimentation orale, ou à la sortie de SSPI / soins critiques. Pas de relais si débit &gt; 4 UI/h.')}
      <details style="margin-top:10px;"><summary class="row-item" style="cursor:pointer; list-style:none;"><div><div class="t">Tableau complet du protocole</div><div class="s">Toucher pour afficher</div></div></summary>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Glycémie</th><th>Initiation</th><th>Adaptation</th><th>Contrôle</th></tr></thead>
        <tbody>
          <tr><td class="strong">&lt; 0,4 g/L (2,2)</td><td>0 · G30 2 amp</td><td>Arrêt · G30 2 amp · médecin</td><td>15 min</td></tr>
          <tr><td class="strong">0,4–0,6 (2,2–3,3)</td><td>0 · G30 1 amp</td><td>Arrêt · G30 1 amp</td><td>30 min</td></tr>
          <tr><td class="strong">0,6–0,9 (3,3–5)</td><td>0</td><td>−1 UI/h</td><td>1 h</td></tr>
          <tr><td class="strong">0,9–1,1 (5–6)</td><td>DT1 1 UI/h · DT2 0</td><td>−1 UI/h</td><td>1 h</td></tr>
          <tr><td class="strong">1,1–1,8 (6–10)</td><td>DT1 1 UI/h · DT2 0</td><td>Idem</td><td>2 h</td></tr>
          <tr><td class="strong">1,8–2,5 (10–14)</td><td>Bolus 3 UI + 2 UI/h</td><td>+1 UI/h</td><td>1 h</td></tr>
          <tr><td class="strong">2,5–3 (14–16,5)</td><td>Bolus 4 UI + 3 UI/h</td><td>+2 UI/h</td><td>1 h</td></tr>
          <tr><td class="strong">≥ 3 (≥ 16,5)</td><td>Bolus 6 UI + 4 UI/h · médecin</td><td>Bolus 6 UI · médecin</td><td>1 h</td></tr>
        </tbody></table></div>
      <div class="subtext" style="margin-top:6px;">Après arrêt pour hypoglycémie : reprise à ½ débit quand glycémie &gt; 5,5 mmol/L (DT1) ou &gt; 10 mmol/L (DT2).</div>
      </details>`;
  }

  if (sub === 'sc'){
    const alim = state.dbAlim;
    const basal = poids ? Math.min(30, Math.round(0.3*poids)) : null;
    const bolusRepas = poids ? Math.round(0.1*poids) : null;
    const corr = dbCorrection(v);
    const repasTxt = alim==='po' ? `${bolusRepas ?? '—'} UI SC avant chaque repas (8 h, 12 h, 20 h), quelle que soit la glycémie` :
      alim==='poi' ? `${bolusRepas!=null ? Math.round(bolusRepas/2) : '—'} UI SC avant chaque repas (moitié de dose : apports insuffisants)` :
      'Pas de bolus « repas » (NE/NP continue ou à jeun)';
    content = `
      ${field('f-db-poids','Poids',state.poids,'kg')}
      ${section('Alimentation')}
      ${seg('dbalim', alim, [{v:'po',label:'Orale complète'},{v:'poi',label:'Orale insuffisante'},{v:'cont',label:'NE/NP continue, à jeun'}])}
      ${box('Prescription de départ', 'var(--teal)', 'var(--tealDim)', `
        <div class="grid grid-2" style="margin-bottom:10px;">
          <div class="stat"><div class="lbl">Insuline lente à 20 h</div><div class="val">${basal ?? '—'} UI</div><div class="sub">0,3 UI/kg/j · max 30 UI à l'initiation</div></div>
          <div class="stat"><div class="lbl">Bolus repas</div><div class="val">${alim==='cont' ? '0' : alim==='poi' ? (bolusRepas!=null ? Math.round(bolusRepas/2) : '—') : (bolusRepas ?? '—')} UI</div><div class="sub">${alim==='cont' ? 'pas de repas' : '× 3/j, 0,1 UI/kg'}${alim==='poi'?' ÷ 2':''}</div></div>
        </div>
        ${line(repasTxt)}
        ${t==='dt1' || t==='dt2i' ? line('Patient déjà sous insuline : préférer sa <strong>dose habituelle</strong> de lente (ou ½ dose IVSE des 24 dernières heures : ' + go('Relais', {tab:'diab', sec:'ins', sub:'relais', id:'c-insuline'}) + ').') : ''}`)}
      ${why("Les besoins d'un adulte sont de 0,4 à 1 UI/kg/j (≈ 0,5 chez le patient stable), dont 30–50 % en basale (ADA 2025) : la RFE SFAR 2025 part de 0,3 UI/kg/j de lente et de 3 bolus de 0,1 UI/kg. La dose de départ de <strong>lente</strong> est plafonnée à 30 UI pour limiter le risque d'hypoglycémie. Sans repas (NE ou NP continue, jeûne), pas de bolus repas. Le bolus correcteur rattrape une glycémie haute avant le repas ; la lente s'ajuste sur la glycémie à jeun, qui reflète son effet de la nuit.")}
      <div id="c-correction"></div>${section('Bolus correcteur (analogue rapide, dans la même injection que le bolus du repas)')}
      ${glyInput}
      ${corr ? `<div class="row-item" style="border:1px solid ${corr.u>=6 || v < dbT('h33') ? 'var(--red)' : 'var(--teal)'}; margin-top:10px;"><div><div class="t">${corr.txt}</div></div></div>` : ''}
      <div style="overflow-x:auto; margin-top:8px;"><table>
        <thead><tr><th>Glycémie</th><th>Bolus correcteur</th></tr></thead>
        <tbody>
          <tr><td class="strong">&lt; 0,6 g/L (3,3)</td><td>1 amp G30 % IV ou 15 g de sucre PO</td></tr>
          <tr><td class="strong">0,6–1,8 (3,3–10)</td><td>0</td></tr>
          <tr><td class="strong">1,8–2,2 (10–12)</td><td>3 UI SC</td></tr>
          <tr><td class="strong">2,2–3 (12–16,5)</td><td>4 UI SC</td></tr>
          <tr><td class="strong">≥ 3 (≥ 16,5)</td><td>6 UI SC + recherche de cétose</td></tr>
        </tbody></table></div>
      ${section('Adaptation de la lente (glycémie à jeun du lendemain)')}
      <div class="chips">
        <span class="chip" style="cursor:default;">&lt; 5 mmol/L (0,9 g/L) : −2 UI</span>
        <span class="chip" style="cursor:default;">5–10 : idem</span>
        <span class="chip" style="cursor:default;">&gt; 10 mmol/L (1,8 g/L) : +2 UI</span>
      </div>
      ${row('En pratique', '<strong>Une seule injection avant chaque repas</strong> (8 h, 12 h, 20 h) : bolus repas + bolus correcteur selon la glycémie mesurée juste avant le repas. Pas de contrôle après le repas. Si le déséquilibre est important, glycémies en plus à 16 h, 0 h et 4 h, avec correction selon le même tableau (sans bolus repas). Sous NE ou NP continue : correction seule, aux horaires de surveillance (toutes les 4 h à l\'initiation ou si déséquilibre, sinon toutes les 8 h).')}
      ${row('Glycémies', 'Préprandiales à 8 h, 12 h, 20 h (+ 16 h, 0 h, 4 h si déséquilibre important).', '/4 h à l\'initiation ou si déséquilibre, sinon /8 h')}`;
  }

  if (sub === 'relais'){
    const d = parseFloat(String(state.dbDebit).replace(',','.'));
    const tot = parseFloat(String(state.dbDose24).replace(',','.'));
    const insPrev = t==='dt1' || t==='dt2i';
    const stop = state.dbStopH;
    const FR = { h0:[0.75,'3/4 de la dose','à 20 h le soir même'], h6:[0.5,'1/2 dose','à 20 h le soir même'], h14:[0.25,'1/4 de dose','à 20 h le soir même'], h16:[1,'dose de 20 h','à 20 h le jour suivant'] };
    let ci = [];
    if (!isNaN(d) && d > 4) ci.push('Débit IVSE &gt; 4 UI/h : <strong>pas de relais</strong>, poursuivre l\'IVSE.');
    if (!isNaN(d) && d <= 0.5 && t==='dt2') ci.push('Débit ≤ 0,5 UI/h chez un patient non insulinotraité : <strong>pas de relais SC</strong>, bolus correcteurs seuls.');
    const basalJ = !isNaN(tot) && tot>0 ? Math.min(30, Math.round(tot/2)) : (poids ? Math.min(30, Math.round(0.3*poids)) : null);
    const basalSrc = !isNaN(tot) && tot>0 ? `½ de ${fmt(tot)} UI${Math.round(tot/2)>30?' (plafonné à 30 UI)':''}` : '0,3 UI/kg/j (dose IVSE inconnue)';
    const repas = !isNaN(tot) && tot>0 ? Math.round(tot/2/3) : (poids ? Math.round(0.1*poids) : null);
    const init = basalJ!=null && stop ? Math.round(basalJ*FR[stop][0]) : null;
    content = `
      <div class="grid grid-2" style="grid-template-columns:1fr 1fr;">
        ${field('f-db-debit','Débit IVSE actuel',state.dbDebit,'UI/h')}
        ${field('f-db-dose24','Dose IVSE sur 24 h',state.dbDose24,'UI','si connue')}
      </div>
      ${field('f-db-poids','Poids',state.poids,'kg')}
      ${section('Heure d\'arrêt de l\'IVSE')}
      <div class="chips">${[['h0','0 h – 6 h'],['h6','6 h – 14 h'],['h14','14 h – 16 h'],['h16','16 h – 0 h']].map(([k,l])=>`<button class="chip ${stop===k?'active':''}" data-act="dbstop" data-val="${k}">${l}</button>`).join('')}</div>
      ${ci.length ? `<div class="warn-box" style="background:var(--redDim); color:var(--text);">${ICONS.alert}<span>${ci.join('<br>')}</span></div>` : ''}
      ${!ci.length ? box('Relais', 'var(--teal)', 'var(--tealDim)', `
        <div class="grid grid-2" style="margin-bottom:10px;">
          <div class="stat"><div class="lbl">Lente maintenant</div><div class="val">${init ?? '—'} UI</div><div class="sub">${stop ? FR[stop][1] : 'choisir l\'heure'}</div></div>
          <div class="stat"><div class="lbl">Lente ensuite</div><div class="val">${basalJ ?? '—'} UI</div><div class="sub">${stop ? FR[stop][2] : '20 h'}</div></div>
        </div>
        ${line(`Dose de lente : ${basalSrc}${insPrev ? ' ; ou dose habituelle du patient' : ''}.`)}
        ${line(`Bolus repas si alimentation orale : <strong>${repas ?? '—'} UI</strong> avant chaque repas (${!isNaN(tot) && tot>0 ? '½ dose IVSE/24 h ÷ 3' : '0,1 UI/kg'}), + bolus correcteurs (${go('tableau', {tab:'diab', sec:'ins', sub:'sc', id:'c-correction'})}).`)}
        ${line('<strong>Pas de délai</strong> entre l\'arrêt de l\'IVSE et l\'injection de la lente (la lente est faite en SSPI).')}`) : ''}
      ${!ci.length ? why("Environ la moitié des besoins d'insuline est basale : la lente reprend la moitié de la dose IVSE des 24 h, et l'autre moitié sert aux repas. La lente met plusieurs heures à agir, d'où l'injection sans délai à l'arrêt de l'IVSE et une fraction de dose selon l'heure pour couvrir jusqu'à 20 h. Un débit &gt; 4 UI/h signe des besoins trop élevés ou instables pour la voie SC. Chez un patient non insulinotraité à ≤ 0,5 UI/h, les besoins sont minimes : les corrections suffisent.") : ''}
      ${section('Conditions')}
      ${row('Indications', 'Glycémies stabilisées ≤ 10 mmol/L (1,8 g/L) ; reprise de l\'alimentation orale (non obligatoire) ; débit ≤ 4 UI/h.')}
      ${row('Contre-indications', 'Débit &gt; 4 UI/h ; besoins en insuline non stabilisés.')}
      ${t==='dt1' ? row('DT1', 'Reprise du schéma antérieur adapté (ou de la pompe). Ne jamais laisser le patient sans insuline basale.', '', 'var(--red)') : ''}`;
  }

  if (sub === 'nph') content = renderNph(h);

  return `
  <div class="card" id="c-insuline">
    <div class="section-title"><div class="icon-box">${ICONS.syringe}</div>
      <div><h2>Insulinothérapie</h2><p class="subtext">Protocoles RFE SFAR 2025 · analogue rapide + insuline lente</p></div></div>
    <div class="chips" style="margin-bottom:14px;">${subs.map(o=>`<button class="chip ${sub===o.v?'active':''}" data-act="dbsub" data-val="${o.v}">${o.label}</button>`).join('')}</div>
    ${content}
  </div>
  ${renderInsulinesTable(h)}`;
}

function bindEvents(){
  document.querySelectorAll('[data-act="tab"]').forEach(el=>el.addEventListener('click', ()=>{ state.tab = el.dataset.val; render(); }));
  document.querySelectorAll('[data-act="renal"]').forEach(el=>el.addEventListener('click', ()=>{ state.renal = el.dataset.val; render(); }));
  document.querySelectorAll('[data-act="propofolConc"]').forEach(el=>el.addEventListener('click', ()=>{ state.propofolConc = parseInt(el.dataset.val); render(); }));
  [['f-propofol','propofolDebit'],['f-g25','g25'],['f-g5','g5'],['f-g10','g10'],['f-g30','g30'],['f-citqsg','citQsg'],['f-citdose','citDose']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e=>{ state[key] = e.target.value; debouncedRenderPartial(); });
  });
  document.querySelectorAll('[data-act="phase"]').forEach(el=>el.addEventListener('click', ()=>{ state.phaseKey = el.dataset.val; state.kcalRatio = 1; render(); }));
  document.querySelectorAll('[data-act="microcheck"]').forEach(el=>el.addEventListener('click', ()=>{ const id = el.dataset.val; state.checked[id] = !state.checked[id]; renderPartial(); }));
  document.querySelectorAll('[data-act="debitSource"]').forEach(el=>el.addEventListener('click', ()=>{ state.debitSource = el.dataset.val; render(); }));
  document.querySelectorAll('[data-act="debitVoie"]').forEach(el=>el.addEventListener('click', ()=>{ state.debitVoie = el.dataset.val; state.debitProduitId = DEBIT_PRODUCTS[state.debitVoie][0].id; render(); }));
  document.querySelectorAll('[data-act="debitDureeType"]').forEach(el=>el.addEventListener('click', ()=>{ state.debitDureeType = el.dataset.val; render(); }));

  const fDebitProduit = document.getElementById('f-debit-produit');
  if (fDebitProduit) fDebitProduit.addEventListener('change', e=>{ state.debitProduitId = e.target.value; renderPartial(); });
  document.querySelectorAll('[data-act="survcheck"]').forEach(el=>el.addEventListener('click', ()=>{ const id = el.dataset.val; state.survChecked[id] = !state.survChecked[id]; renderPartial(); }));
  document.querySelectorAll('[data-act="potoggle"]').forEach(el=>el.addEventListener('click', ()=>{ const k = el.dataset.val; state[k] = !state[k]; renderPartial(); }));
  document.querySelectorAll('[data-act="pofdr"]').forEach(el=>el.addEventListener('click', ()=>{ const k = el.dataset.val; state.poFdrList[k] = !state.poFdrList[k]; renderPartial(); }));
  document.querySelectorAll('[data-act="pocfs"]').forEach(el=>el.addEventListener('click', ()=>{ const n = parseInt(el.dataset.val); state.poCfs = state.poCfs===n ? 0 : n; state.poCfsOpen = false; renderPartial(); }));
  const cfsDet = document.getElementById('po-cfs-details');
  if (cfsDet) cfsDet.addEventListener('toggle', ()=>{ if (cfsDet.open !== state.poCfsOpen){ state.poCfsOpen = cfsDet.open; renderPartial(); } });
  const poDet = document.getElementById('po-fdr-details');
  if (poDet) poDet.addEventListener('toggle', ()=>{ if (poDet.open !== state.poFdrOpen){ state.poFdrOpen = poDet.open; renderPartial(); } });
  { const el = document.getElementById('f-po-prehab'); if (el) el.addEventListener('change', e=>{ state.poPrehabInterv = e.target.value; renderPartial(); }); }
  const fPoInterv = document.getElementById('f-po-interv');
  if (fPoInterv) fPoInterv.addEventListener('change', e=>{ state.poInterv = e.target.value; renderPartial(); });
  document.querySelectorAll('[data-act="podelai"]').forEach(el=>el.addEventListener('click', ()=>{ state.poDelai = el.dataset.val; renderPartial(); }));
  [['f-po-taille','taille'],['f-po-poids','poids'],['f-po-hab','poPoidsHab'],['f-po-alb','poAlb']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e=>{ state[key] = e.target.value; debouncedRenderPartial(); });
  });
  const fSurvMode = document.getElementById('f-surv-mode');
  if (fSurvMode) fSurvMode.addEventListener('change', e=>{ state.survMode = e.target.value; renderPartial(); });
  const fMicroMode = document.getElementById('f-micro-mode');
  if (fMicroMode) fMicroMode.addEventListener('change', e=>{ state.microMode = e.target.value; renderPartial(); });
  const fSoluteSituation = document.getElementById('f-solute-situation');
  if (fSoluteSituation) fSoluteSituation.addEventListener('change', e=>{ state.soluteSituation = e.target.value; renderPartial(); });
  const fDebitKcal = document.getElementById('f-debit-kcal');
  if (fDebitKcal) fDebitKcal.addEventListener('input', e=>{ state.debitKcalManuel = e.target.value; debouncedRenderPartial(); });
  const fDebitValeur = document.getElementById('f-debit-valeur');
  if (fDebitValeur) fDebitValeur.addEventListener('input', e=>{ state.debitValeur = e.target.value; debouncedRenderPartial(); });

  const fTaille = document.getElementById('f-taille');
  if (fTaille) fTaille.addEventListener('input', e=>{ state.taille = e.target.value; debouncedRenderPartial(); });
  const fPoids = document.getElementById('f-poids');
  if (fPoids) fPoids.addEventListener('input', e=>{ state.poids = e.target.value; debouncedRenderPartial(); });
  const fRatio = document.getElementById('f-ratio');
  if (fRatio) fRatio.addEventListener('input', e=>{ state.kcalRatio = parseFloat(e.target.value); renderPartial(); });
  const fSri = document.getElementById('f-sri');
  if (fSri) fSri.addEventListener('change', e=>{ state.sriRisk = e.target.checked; renderPartial(); });
  // Diabète
  const dbSet = (act, fn) => document.querySelectorAll(`[data-act="${act}"]`).forEach(el=>el.addEventListener('click', ()=>{ fn(el.dataset.val); renderPartial(); }));
  dbSet('dbsec', v=>{ state.dbSec = v; });
  dbSet('dbtype', v=>{ state.dbType = state.dbType===v ? '' : v; });
  dbSet('dbchir', v=>{ state.dbChir = state.dbChir===v ? '' : v; });
  dbSet('dbttt', v=>{ state.dbTtt[v] = !state.dbTtt[v]; });
  dbSet('dbunit', v=>{ state.dbUnit = v; });
  dbSet('dbivseon', v=>{ state.dbIvseOn = v==='on'; });
  dbSet('dbsub', v=>{ state.dbInsSub = v; });
  dbSet('dbalim', v=>{ state.dbAlim = v; });
  dbSet('dbstop', v=>{ state.dbStopH = state.dbStopH===v ? '' : v; });
  dbSet('dbpost', v=>{ state.dbPostMode = state.dbPostMode===v ? '' : v; });
  dbSet('dbtoggle', v=>{ state[v] = !state[v]; });
  { const el = document.getElementById('f-nph-sol'); if (el) el.addEventListener('change', e=>{ state.nphSol = parseInt(e.target.value); renderPartial(); }); }
  dbSet('nphvolet', v=>{ state.nphVolet = state.nphVolet===v ? '' : v; });
  dbSet('nphprof', v=>{ state.nphProfil = state.nphProfil===v ? '' : v; });
  dbSet('nphcort', v=>{ state.nphCort = state.nphCort===v ? '' : v; });
  document.querySelectorAll('[data-act="goto"]').forEach(el=>el.addEventListener('click', e=>{ e.preventDefault(); goTo({tab:el.dataset.tab, sec:el.dataset.sec, sub:el.dataset.sub, id:el.dataset.id}); }));
  { const d = document.getElementById('ins-tab'); if (d) d.addEventListener('toggle', ()=>{ if (d.open !== state.insTabOpen){ state.insTabOpen = d.open; renderPartial(); } }); }
  dbSet('egcont', v=>{ state.egContenu = state.egContenu===v ? '' : v; if (state.egContenu!=='liquide') state.egGrade=''; });
  document.querySelectorAll('details[data-ado]').forEach(d=>d.addEventListener('toggle', ()=>{ state.adoOpen[d.dataset.ado] = d.open; }));
  dbSet('eggrade', v=>{ state.egGrade = state.egGrade===v ? '' : v; });
  [['eg-tech','egOpenTech'],['eg-interp','egOpenInterp']].forEach(([id,key])=>{ const d = document.getElementById(id); if (d) d.addEventListener('toggle', ()=>{ if (d.open !== state[key]){ state[key] = d.open; renderPartial(); } }); });
  [['f-db-hba1c','dbHba1c'],['f-nph-ne','nphNeDebit'],['f-nph-cort','nphCortDose'],['f-eg-age','egAge'],['f-eg-poids','poids'],['f-eg-ap','egAP'],['f-eg-cc','egCC'],['f-eg-csa','egCSA'],['f-db-gly','dbGly'],['f-db-debit','dbDebit'],['f-db-dose24','dbDose24'],['f-db-clcr','dbClcr'],['f-db-basale','dbBasale'],['f-db-poids','poids']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', e=>{ state[key] = e.target.value; debouncedRenderPartial(); });
  });
}

// Reconstruire l'écran immédiatement après une saisie déstabilise le clavier virtuel
// sur certains navigateurs Android (le champ est détruit puis recréé à chaque frappe).
// On attend une courte pause dans la frappe avant de reconstruire.
let renderDebounceTimer = null;
function debouncedRenderPartial(){
  clearTimeout(renderDebounceTimer);
  renderDebounceTimer = setTimeout(renderPartial, 600);
}

// re-render only the content area, preserving input focus where possible
function renderPartial(){
  const content = document.getElementById('content');
  const activeId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement ? document.activeElement.selectionStart : null;
  content.innerHTML = PANELS[state.tab]();
  enhanceCards();
  bindEvents();
  if (activeId){
    const el = document.getElementById(activeId);
    if (el){ el.focus(); if (selStart!=null && el.setSelectionRange) { try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }
  }
}

render();
</script>
